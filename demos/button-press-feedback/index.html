  html{background:#000; overflow-x:clip} /* bg: overscroll must read true-black, not lifted ink; overflow-x:clip: the 100vw .stage overhang must never spawn a horizontal bar (clip, not hidden — hidden would break .stage's sticky) */
  html.gutter{scrollbar-gutter:stable}
  html.journey-held{scrollbar-width:none;scrollbar-gutter:auto}
  html.journey-held body{scrollbar-width:none}
  html.journey-held::-webkit-scrollbar,html.journey-held body::-webkit-scrollbar{width:0;height:0;display:none}
  body.locked{overflow:hidden; height:100vh}
  /* phone: while the site is driving the guided journey, deny the compositor the
     vertical pan so onGuideTouch's preventDefault stays authoritative (a real phone
     otherwise hands the swipe to native scroll / the soft keyboard before JS runs).
     pan-x pinch-zoom (NOT none) keeps two-finger zoom for a11y; scrollTo() — the
     glide — is programmatic and unaffected by touch-action. */
  body.guiding, body.guiding .seam-stage{ touch-action:pan-x pinch-zoom; overscroll-behavior:none }
  .mono{font-family:'Cascadia Mono',Consolas,monospace}

  /* ---- film stage ---- */
  /* sticky: the film pins to the viewport so the black closed section physically
     rises OVER it as you scroll — the black-tide hand-off (idea C) */
  /* width:100vw (not 100%): after unlock the reserved gutter shrinks the layout
     viewport; sizing to the FULL viewport keeps the film truly full-bleed under
     the scrollbar instead of leaving a 15px html-#000 strip on the right.
     object-fit:cover crops far more than those 15px, so nothing is lost. */
  .stage{position:sticky; top:0; z-index:0; height:100vh; overflow:hidden; background:var(--ink);
    width:100vw; isolation:isolate}
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .wash{position:absolute; inset:0; pointer-events:none; background:
    linear-gradient(to bottom, rgba(11,10,8,.72), rgba(11,10,8,.12) 30%, rgba(11,10,8,.12) 65%, rgba(11,10,8,.88))}

  .hud{position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column;
    justify-content:space-between; padding:clamp(20px,4vw,48px); z-index:2}
  .hud-top{display:flex; justify-content:flex-end; align-items:flex-start; letter-spacing:.28em;
    font-size:12px; color:var(--gold); text-transform:uppercase}
  /* brand mark — the IG profile logo, avatar-style with a gold ring */
  .brand-mark{width:46px; height:46px; border-radius:50%; display:block;
    border:1px solid rgba(212,175,95,.55); box-shadow:0 0 18px rgba(0,0,0,.5)}
  /* absolutely centred — the hud's flex column lost its bottom row, so flex
     spacing alone would sink the title below the middle */
  .title-block{text-align:center; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); width:max-content; max-width:92vw;
    transition:opacity .8s ease}
  /* min low enough that the wordmark stays ONE line down to 320px-wide screens */
  h1{font-size:clamp(30px,11vw,128px); font-weight:400; letter-spacing:.14em; margin:0;
    text-shadow:0 2px 40px rgba(0,0,0,.6); white-space:nowrap}
  h1 .v{color:var(--gold-hot)}

  /* the 1:1 traced logo mark (V + star), set into the wordmarks in gold.
     Height: V body is 1/1.396 of the mark; 1.09em = V ~13% over cap height. */
  .vmark{height:1.09em; width:auto; display:inline-block; vertical-align:baseline;
    color:var(--gold-hot); margin-right:.1em;
    filter:drop-shadow(0 0 .18em rgba(240,212,146,.35))}
  h1 .vmark{vertical-align:-0.04em}  /* film wordmark: optical baseline match */
  .vt .vmark{vertical-align:-0.04em} /* vault title: same slight drop */

  /* film-end logo handoff: the film's last act is a black card with the white
     V+star. The site's own traced mark is laid EXACTLY over it (video px mapped
     through object-fit:cover — placeFilmLogo), then tinted white → gold: the
     film's logo becomes ours, and the rising black tide carries it into CLOSED. */
  /* once the card lands, a true-#000 cover fades over the whole video — the
     <video> element's black renders slightly LIFTED on many screens, so only a
     real #000 layer makes the card match the site's deep black exactly. The
     film's white V hands to a DOM white V (white-on-white, invisible), then gold
     POURS down the mark — that pour IS the white→gold handoff (Liquid gold descent). */
  .card-cover{position:absolute; inset:0; display:none; opacity:0;
    background:#000; pointer-events:none}
  .film-logo{position:absolute; display:none; opacity:0; pointer-events:none; z-index:10} /* above .stage-dim (z9): after the film the mark RIDES the wall out of frame at full gold — it is never dimmed */
  .film-logo .mk{position:absolute; inset:0}
  .film-logo .mk-gold{color:var(--gold-hot)}   /* the metal, uncovered by the pour */
  .film-logo .mk-white{color:#fff}              /* the film's white V, erased top→tip */
  .film-logo .vmark{height:100%; width:100%; color:inherit; margin:0}
  /* the mark's glow is driven per-tick on #filmLogo (JS) so it can be ABSENT at the
     film-V seam and rise only with the gold pour — matches the film's un-glowed white */
  /* the card IS the closing title — don't bring the wordmark back over it
     (.done.cardend: must outrank the .stage.done opacity:1 rule below) */
  .stage.done.cardend .title-block{opacity:0}

  /* post-surface "light under the door": the vault's glow seeping along the
     bottom edge + a 1px gold thread dripping from the V into it.
     LAW 2: solid hairlines + box-shadow glow only — no gradient fills. */
  /* the black tide, as a compositor-only layer. This used to be a CSS filter on
     .stage — which contains the <video>, so every scroll tick pushed the film
     frame through a filter pass and repainted a full-viewport layer, in the
     busiest frame budget on the page. z-index:9 clears every child of .stage
     (nothing in there declares above 2) so the dim covers exactly what the
     filter did, including the gold mark during the handoff. */
  .stage-dim{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:9}
  .underglow{position:absolute; left:0; right:0; bottom:0; height:2px; display:none;
    background:var(--gold-hot); pointer-events:none; z-index:2;
    box-shadow:0 0 18px 3px rgba(240,212,146,.55), 0 0 60px 12px rgba(240,212,146,.22)}

  /* letter-stagger wordmark reveal (idea 06) — spans built in JS, delays inline;
     the .vwrap span makes the traced mark ride the same reveal as a letter */
  .stagger .l{display:inline-block; opacity:0}
  .stagger.reveal .l{animation:letterUp .7s cubic-bezier(.2,.9,.3,1) forwards}
  /* V-first intro: the pour copy stacked exactly on the base mark inside .vslot.
     Sized/positioned by vMeasure() to the BASE svg's measured rect — height:100%
     of the slot span was ~16% too tall (the span's line box carries the font
     strut), which painted a second, offset V behind the mark. opacity:0 until
     JS drives it, so reduced-motion (where vRender never runs) can't show it. */
  .vslot{position:relative}
  /* Safari can expose the rectangular backing surface of a drop-shadow when a
     filtered SVG wrapper is scaled while its pour copy is being masked. Keep
     the opening mark crisp and paint its light on a separate, generously sized
     layer whose pixels are already transparent before every outer edge. */
  .vslot .vmark{filter:none; overflow:visible}
  .intro-v-halo{position:absolute; left:50%; top:50%; z-index:1; pointer-events:none;
    width:min(112vw,720px); height:min(74vh,620px); border-radius:50%; opacity:0;
    transform:translate(-50%,-50%); background:radial-gradient(ellipse at center,
      rgba(240,212,146,.52) 0%, rgba(240,212,146,.18) 24%,
      rgba(240,212,146,.045) 52%, rgba(240,212,146,0) 78%)}
  .stage.playing .intro-v-halo,.stage.done .intro-v-halo{opacity:0!important}
  .vmark.pour{position:absolute; left:0; top:0; height:100%; width:auto; margin:0; filter:none; opacity:0}
  @keyframes letterUp{from{opacity:0; transform:translateY(.35em); filter:blur(6px)}
    to{opacity:1; transform:none; filter:none}}
  .rule{width:72px; height:1px; background:var(--gold); margin:22px auto 0; opacity:.8}

  /* states */
  @keyframes pulse{50%{opacity:.35}}
  .stage.playing .title-block{opacity:0}
  .stage.done .title-block{opacity:1}
  /* the guided-journey cue — a fixed prompt that tells you the next move */
  /* width:max-content + the viewport cap, on EVERY screen: one line wherever it
     fits, a centred two-line box where it doesn't. The old nowrap default clipped
     both ends on big Androids (Pixel Pro/XL, Galaxy Ultra report >430 CSS px and
     missed the phone breakpoint), and the old wrapped version shrank to ~50vw —
     left:50% gives a fixed element only half the viewport of shrink-to-fit room —
     so iPhones got a cramped six-line tower instead of the capped box. */
  .guide-cue{position:fixed; left:50%; bottom:clamp(22px,4.5vh,44px); transform:translateX(-50%) translateY(10px);
    z-index:85; pointer-events:none; color:var(--gold-hot); font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; text-align:center; opacity:0; line-height:1.55;
    width:max-content; max-width:calc(100vw - 24px); box-sizing:border-box;
    padding:9px 18px; border-radius:2px; background:rgba(11,10,8,.62); border:1px solid rgba(240,212,146,.28);
    transition:opacity .55s ease, transform .55s ease}
  .guide-cue.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* phones (site-wide 560px breakpoint): smaller face so the box stays shallow */
  @media (max-width:560px){
    .guide-cue{font-size:11px; letter-spacing:.16em}
  }
  .guide-cue .g-chev{display:inline-block; margin-left:.35em; color:var(--gold-hot);
    animation:cuebounce 1.5s ease-in-out infinite}
  @keyframes cuebounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* ---- BEYOND: the post-surface continuation ----
     Hidden during the guided journey. Surfacing (▲ Surface) retires the
     CLOSED→vault loop — body.surfaced collapses the seam+descent — and the
     site continues HERE from the black card + gold mark. Content TBD. */
  .beyond{display:none; position:relative; z-index:1; background:#000;
    /* bottom padding deliberately shallow: the scroll should STOP with the game
       teaser just off the page's end, not run on into ~120px of dead black (Jacob) */
    padding:clamp(56px,9vw,120px) clamp(20px,6vw,80px) clamp(24px,4vw,40px); min-height:120vh}
  .beyond::before{content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8}
  /* phone: kill the 120vh floor — content is SHORTER than it there, so it was
     stretching ~2 empty viewport-tenths of black past the game teaser. The page
     now ends at the teaser's own bottom rule, with the crew still in frame. */
  @media (max-width:560px){
    .beyond{min-height:0; padding-bottom:10px}
  }
  .beyond-inner{max-width:820px; margin:0 auto; text-align:center}
  .beyond-note{letter-spacing:.3em; text-transform:uppercase; font-size:11px;
    color:var(--gold); opacity:.6}
  body.surfaced .beyond{display:block}
  body.surfaced .seamsec, body.surfaced .descent{display:none}
  @media (hover:hover) and (pointer:fine){
    body.surfaced.stage-retired .stage{visibility:hidden}
  }
  .crew{contain:paint}
  .flap{background:#000; isolation:isolate}

  /* ---- THE NIGHT: the post-surface chapter (lives inside .beyond) ---- */
  .night{margin-top:clamp(40px,7vw,84px); text-align:left}
  .crew{overflow:hidden; margin:clamp(36px,6vw,64px) calc(-1 * clamp(20px,6vw,80px)) 0; padding:10px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .crew-strip{display:flex; gap:10px; width:max-content; will-change:auto}
  .crew-strip img{height:clamp(150px,34vw,260px); width:auto; display:block;
    border:1px solid rgba(212,175,95,.2); filter:saturate(.5) contrast(1.05)}
  .signoff{margin:clamp(56px,9vw,110px) auto 0; text-align:center; max-width:520px}
  .signoff .so-line{color:var(--gold); letter-spacing:.14em; font-size:15px; margin-bottom:30px}
  .signoff .signup{margin-top:0; text-align:left}
  .signoff .so-end{margin-top:34px; letter-spacing:.3em; font-size:9px; color:var(--bone-dim);
    text-transform:uppercase; opacity:.55}

  /* ---- FLAPPY-V: the last beat of BEYOND — fly the V through the seam ----
     The panel is a teaser; the game itself runs in a fullscreen overlay that
     locks scroll and input until ▕ EXIT or Escape. */
  .flap{margin:clamp(56px,9vw,110px) auto 0; max-width:820px; text-align:center}
  .flap-label{letter-spacing:.3em; text-transform:uppercase; font-size:11px; color:var(--gold);
    margin-bottom:14px}
  .flap-teaser{border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:clamp(36px,6vw,64px) 20px; background:#000}
  .flap-sub{letter-spacing:.18em; font-size:10px; color:var(--bone-dim); text-transform:uppercase;
    margin:14px 0 26px; line-height:1.8}
  .flap-play{background:var(--gold); color:var(--ink); border:0; cursor:pointer; border-radius:0;
    font-family:'Cascadia Mono',Consolas,monospace; font-size:12px; letter-spacing:.28em;
    text-transform:uppercase; padding:15px 34px; transition:background .25s ease, transform .12s ease}
  .flap-play:hover{background:var(--gold-hot)}
  .flap-play:focus-visible{outline:1px solid var(--gold-hot); outline-offset:3px}
  .flap-best{margin-top:18px; letter-spacing:.24em; font-size:10px; color:var(--gold);
    text-transform:uppercase; opacity:.85; min-height:1em}
  /* the locked-in overlay */
  .flap-overlay{position:fixed; inset:0; z-index:400; background:#000; display:none;
    overscroll-behavior:contain; touch-action:none;
    -webkit-tap-highlight-color:transparent;   /* the blue flash on every Chrome tap */
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  .flap-overlay.on{display:block}
  #flap{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;
    cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  .flap-exit{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:2;
    background:rgba(11,10,8,.62); border:1px solid var(--line); color:var(--gold);
    font-family:'Cascadia Mono',Consolas,monospace; font-size:10px; letter-spacing:.28em;
    text-transform:uppercase; padding:11px 16px; cursor:pointer; border-radius:0;
    transition:border-color .25s ease}
  .flap-exit:hover{border-color:var(--gold)}

  /* Flappy V: native text stays sharp at every display scale. */
  .flap-hud{position:absolute;left:max(20px,env(safe-area-inset-left));top:calc(20px + env(safe-area-inset-top));pointer-events:none;color:var(--gold);font:10px Consolas,monospace;letter-spacing:.18em}
  .flap-hud strong{display:block;font:500 32px/1.1 Consolas,monospace;letter-spacing:-.06em;color:var(--bone)}
  .flap-hud small{font-size:11px;color:var(--gold);letter-spacing:0}
  .flap-pause{right:120px;letter-spacing:.08em}
  .flap-tier{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;color:var(--gold);font:11px/1.8 Consolas,monospace;letter-spacing:.12em;pointer-events:none}
  .flap-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 40px));padding:28px 20px;text-align:center;background:rgba(8,7,5,.92);border:1px solid rgba(212,175,95,.28);box-sizing:border-box}
  .flap-panel[hidden]{display:none}
  .flap-panel .eyebrow{color:var(--gold);font:10px Consolas,monospace;letter-spacing:.26em}
  .flap-panel h2{font:500 clamp(24px,5vw,34px)/1.15 Consolas,monospace;letter-spacing:-.05em;color:var(--bone);margin:16px 0}
  .flap-panel p{color:var(--bone-dim);font:12px/1.8 Consolas,monospace;margin:0 0 22px}
  .flap-panel button{min-height:44px}
  .flap-overlay button:focus-visible{outline:2px solid var(--gold-hot);outline-offset:4px}
  @media(max-height:440px){.flap-panel{padding:16px}.flap-panel h2{margin:10px 0}.flap-panel p{margin-bottom:12px}}

  /* ---- closed + email ---- */
  /* rides up over the pinned film as the black tide; gold rim on its leading edge */
  .after{position:relative; z-index:1; background:#000;
    padding:clamp(56px,9vw,120px) clamp(20px,6vw,80px)}
  .after::before{content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8}

  .signup{margin-top:44px; border:1px solid var(--line); padding:clamp(24px,4vw,36px)}
  .signup-label{letter-spacing:.3em; text-transform:uppercase; font-size:11px; color:var(--gold); margin-bottom:18px}
  .signup form{display:flex; gap:12px; flex-wrap:wrap}
  /* 16px minimum — anything smaller makes iOS Safari zoom the page on focus */
  .signup input[type=email]{flex:1 1 240px; min-width:0; background:transparent; border:1px solid var(--line);
    color:var(--bone); font-family:'Cascadia Mono',Consolas,monospace; font-size:16px; letter-spacing:.06em;
    padding:14px 16px; outline:none; border-radius:0; -webkit-appearance:none; transition:border-color .25s ease}
  .signup input[type=email]::placeholder{color:var(--bone-dim); opacity:.55}
  .signup input[type=email]:focus{border-color:var(--gold)}
  .signup button{flex:0 0 auto; background:var(--gold); color:var(--ink); border:0; cursor:pointer; border-radius:0;
    font-family:'Cascadia Mono',Consolas,monospace; font-size:12px; letter-spacing:.24em; text-transform:uppercase;
    padding:14px 26px; transition:background .25s ease, transform .12s ease}
  .signup button:hover{background:var(--gold-hot)}
  .signup button:active, .flap-play:active{transform:translateY(1px) scale(.98)}
  .signup button:focus-visible{outline:1px solid var(--gold-hot); outline-offset:3px}
  .signed{display:none}
  .signup.done form{display:none}
  .signup.done .signed{display:block}
  .signed-line{color:var(--gold-hot); font-size:18px; letter-spacing:.06em}
  @keyframes receiptUp{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}  .signup.done .signed-line{animation:receiptUp .45s ease-out both}
  /* the rejected-address state. Always rendered at opacity 0 with a fixed height
     so the translateY(-50%) gold panel NEVER reflows when it appears — and in
     --bone, not a new hue: a salmon error tint on the teal tower photo reads as
     a generic web form, which is the one thing that panel must not read as. */
  .signup .err{opacity:0; margin-top:12px; height:1em; letter-spacing:.24em;
    font-size:10px; text-transform:uppercase; color:var(--bone-dim); transition:opacity .2s ease}
  .signup.bad .err{opacity:1}
  .signup.bad input[type=email], .seam-gold .signup.bad input[type=email]{border-color:var(--bone)}
  @keyframes formShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}  .signup.bad input[type=email]{animation:formShake .26s ease}
  .signup.done .err{display:none}   /* else it leaves dead space above the receipt */

  /* ---- THE SEAM (closed section, critic #1): the word CLOSED splits like the
     vault doors; hot-gold light inside carries the message + the signup.
     Scroll-scrubbed over a 260vh track; halves are ONE word cloned + clipped. ---- */
  /* z-index 70: sits ABOVE the fixed vault (60), so when the sealed word lifts
     away the door is revealed directly beneath it — the section IS the transition */
  .seamsec{padding:0; position:relative; z-index:70; background:transparent}
  .seam-track{height:300vh; position:relative}
  .seam-stage{position:sticky; top:0; height:100vh; overflow:hidden; background:transparent}
  /* everything rides .seam-lift; its black bg is what rises off to reveal the vault */
  .seam-lift{position:absolute; inset:0; background:#000; will-change:transform}
  .seam-lift::after{content:''; position:absolute; left:0; right:0; top:calc(100% - 2px);
    height:calc(20vh + 2px); background:#000; pointer-events:none}
  /* the doors open onto the DECKS PHOTO (the DJ at the window), not bare gold —
     the dive then zooms straight into it. Near-black fallback matches the
     photo's shadows so a slow load never flashes gold. */
  .seam-gold{position:absolute; left:50%; top:0; bottom:0; width:0; transform:translateX(-50%);
    overflow:hidden; /* the nowrap .sg1 text must never paint outside the panel while it's narrow */
    background:#0b0a08 center 38%/cover no-repeat; z-index:1; overflow:hidden}
  /* legibility scrim over the photo — dark top/bottom, clearer on the decks */
  .seam-gold::before{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(7,7,8,.66), rgba(7,7,8,.20) 32%, rgba(7,7,8,.24) 62%, rgba(4,4,5,.80))}
  /* anchored to the panel's own edges so content can NEVER spill onto the black */
  .seam-gold-in{position:absolute; left:16px; right:16px; top:50%; transform:translateY(-50%);
    text-align:center; color:var(--bone); opacity:0; transition:transform .18s ease}
  .signal-copy{position:relative;max-width:430px;margin:0 auto;padding:22px 18px 18px;overflow:hidden;
    border-block:1px solid rgba(240,212,146,.48);background:linear-gradient(180deg,rgba(4,9,10,.18),rgba(4,9,10,.55));
    box-shadow:0 18px 70px rgba(0,0,0,.35);animation:signalFloat 6s ease-in-out infinite}
  .signal-copy::before{content:'';position:absolute;z-index:-1;left:-35%;top:0;width:28%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(240,212,146,.13),transparent);
    transform:skewX(-13deg);animation:signalScan 6s cubic-bezier(.6,0,.25,1) infinite}
  .signal-copy::after{content:'';position:absolute;inset:7px;pointer-events:none;
    border-left:1px solid rgba(240,212,146,.16);border-right:1px solid rgba(240,212,146,.16)}
  .signal-brand{width:min(150px,42vw);aspect-ratio:766/285;margin:0 auto 17px;background:var(--bone);
    -webkit-mask:url('vctrs-wordmark.svg') center/contain no-repeat;mask:url('vctrs-wordmark.svg') center/contain no-repeat;
    filter:drop-shadow(0 0 0 rgba(240,212,146,0));animation:brandSignal 6s ease-in-out infinite}
  @keyframes signalFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes signalScan{0%,18%{left:-35%;opacity:0}28%{opacity:1}62%{left:112%;opacity:.8}63%,100%{left:112%;opacity:0}}
  @keyframes brandSignal{0%,100%{background:var(--bone);filter:drop-shadow(0 0 0 rgba(240,212,146,0))}
    48%,58%{background:var(--gold-hot);filter:drop-shadow(0 0 13px rgba(240,212,146,.55))}}
  /* THE HEADLINE treatment (Jacob's pick from the 3 demos, sizes bumped so
     every line reads at arm's length): mono kicker → giant serif hero →
     glowing rule → mono sub. Hard 1px black shadow + deep glow on the small
     lines — they must cut through the photo's sky, not whisper over it. */
  .sg1{font-family:'Cinzel',Georgia,serif; letter-spacing:.2em; font-size:16px; font-weight:600;
    color:var(--gold-hot); margin-bottom:14px; white-space:nowrap;
    text-shadow:0 1px 3px #000, 0 2px 14px rgba(0,0,0,.95)}
  .sgh{font-family:'Cinzel',Georgia,serif; font-weight:700; font-size:clamp(30px,9.5vw,50px);
    line-height:1.14; letter-spacing:.03em; color:var(--bone); margin-bottom:16px;
    text-shadow:0 2px 6px rgba(0,0,0,.95), 0 6px 30px rgba(0,0,0,.85)}
  .sgh em{font-style:normal; color:var(--gold-hot)}
  .sgr{width:72px; height:2px; background:var(--gold-hot); margin:0 auto 20px;
    box-shadow:0 0 12px rgba(240,212,146,.5)}
  /* A restrained status breath on the existing seam composition. */
  @keyframes nextPopupBreath{
    0%,100%{text-shadow:0 2px 6px rgba(0,0,0,.95),0 6px 30px rgba(0,0,0,.85),0 0 0 rgba(240,212,146,0)}
    50%{text-shadow:0 2px 6px rgba(0,0,0,.95),0 6px 30px rgba(0,0,0,.85),0 0 22px rgba(240,212,146,.44)}
  }
  @keyframes nextPopupRuleBreath{
    0%,100%{opacity:.72;box-shadow:0 0 10px rgba(240,212,146,.34)}
    50%{opacity:1;box-shadow:0 0 20px rgba(240,212,146,.68)}
  }
  .sgh em{animation:nextPopupBreath 6s ease-in-out infinite}
  .sgr{animation:nextPopupRuleBreath 6s ease-in-out infinite;transform-origin:center}
  .sg2{font-family:'Cinzel',Georgia,serif; letter-spacing:.18em; font-size:15px; font-weight:600;
    color:var(--gold-hot); margin-bottom:12px; white-space:nowrap;
    text-shadow:0 1px 3px #000, 0 2px 14px rgba(0,0,0,.95)}
  /* the countdown to the pop-up doors — mono so it reads as a live ticker against
     the Cinzel lines above it; tabular-nums keeps the digits from jittering */
  .sgc{font-family:'Cascadia Mono',Consolas,monospace; letter-spacing:.2em; font-size:13px;
    color:rgba(239,233,220,.92); margin-bottom:24px; white-space:nowrap;
    font-variant-numeric:tabular-nums; text-shadow:0 1px 3px #000, 0 2px 14px rgba(0,0,0,.95)}
  /* phone: narrower light shaft (JS caps the gap too) + bigger word so OPEN
     still flanks the gold instead of being shoved off-screen */
  @media (max-width:560px){
    .seam-word{font-size:32vw}
    .sg1{font-size:14px; letter-spacing:.2em}
    .sg2{font-size:13px; letter-spacing:.18em}
    .sgc{font-size:11.5px; letter-spacing:.16em}
    .seam-gold .signup{padding:12px}
    /* keep the email row on ONE line in the now-wide gold panel; if it must wrap
       on the tiniest screens, the button spans full width, not a stranded stub */
    .seam-gold .signup input[type=email]{flex:1 1 130px; padding:12px 12px; font-size:16px}
    .seam-gold .signup button{flex:1 0 auto; padding:12px 18px}
  }
  .seam-gold .signup{margin-top:0; border:1px solid rgba(239,233,220,.45); padding:14px;
    background:rgba(2,10,12,.38);box-shadow:inset 0 0 0 0 rgba(240,212,146,0);
    animation:controlSignal 6s ease-in-out infinite}
  @keyframes controlSignal{0%,100%{border-color:rgba(239,233,220,.35);box-shadow:inset 0 0 0 0 rgba(240,212,146,0)}
    50%{border-color:rgba(240,212,146,.68);box-shadow:inset 0 0 24px rgba(240,212,146,.045)}}
  /* Hold control: a centred gold charge, calm at rest and luminous under pressure. */
  .vhold{position:relative;display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;
    min-height:56px;background:rgba(2,10,12,.38);border:1px solid rgba(239,233,220,.38);cursor:pointer;border-radius:2px;
    font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.3em;text-indent:.3em;
    touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;isolation:isolate;overflow:hidden;padding:0 12px;
    box-shadow:inset 0 0 0 1px rgba(240,212,146,.025);
    transition:transform .12s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease}
  .vhold.holding{transform:translateY(1px);border-color:rgba(240,212,146,.72);
    box-shadow:inset 0 0 28px rgba(240,212,146,.09),0 0 18px rgba(240,212,146,.08)}
  .vh-base{position:relative;z-index:2;color:rgba(212,175,95,.62);transition:color .2s ease,text-shadow .2s ease}
  .vhold.holding .vh-base{color:var(--gold-hot);text-shadow:0 0 13px rgba(240,212,146,.3)}
  .vh-fill{position:absolute;z-index:0;inset:3px;background:linear-gradient(90deg,
    rgba(212,175,95,.015) 0%,rgba(240,212,146,.16) 50%,rgba(212,175,95,.015) 100%);
    transform:scaleX(0);transform-origin:50% 50%;will-change:transform;pointer-events:none}
  .vh-line{position:absolute;z-index:1;left:50%;bottom:0;height:2px;width:100%;transform:translateX(-50%) scaleX(0);transform-origin:50% 50%;
    background:linear-gradient(90deg,rgba(240,212,146,0),var(--gold-hot) 18%,var(--gold-hot) 82%,rgba(240,212,146,0));
    box-shadow:0 0 12px rgba(240,212,146,.62);will-change:transform;pointer-events:none}
  .vhold.full{border-color:var(--gold-hot);background:rgba(212,175,95,.12);
    box-shadow:inset 0 0 34px rgba(240,212,146,.16),0 0 22px rgba(240,212,146,.13)}
  .vhold.full .vh-base{color:var(--bone);text-shadow:0 0 16px rgba(240,212,146,.62)}
  .vhold:focus-visible{outline:1px solid var(--gold-hot);outline-offset:3px}
  .seam-gold .signup input[type=email]{flex:1 1 150px; border-color:rgba(239,233,220,.45); color:var(--bone)}
  .seam-gold .signup input[type=email]::placeholder{color:rgba(239,233,220,.6); opacity:1}
  .seam-gold .signup input[type=email]:focus{border-color:var(--gold-hot)}
  /* the button keeps the base gold treatment — the old ink-on-dark override
     disappeared into the panel's shadows (Jacob: "you can't see it's a box") */
  .seam-gold .signed-line{color:var(--bone)}
  .seam-half{pointer-events:none; position:absolute; top:0; bottom:0; width:50%; overflow:hidden; background:#000;
    z-index:2; will-change:transform}
  .shL{left:0} .shR{right:0}
  /* OPEN is 4 letters where CLOSED was 6 — bigger glyphs keep the same visual mass */
  .seam-word{position:absolute; top:50%; transform:translateY(-50%); width:200%; text-align:center;
    font-size:clamp(80px,24vw,250px); letter-spacing:.04em; line-height:1.1; color:var(--bone)}
  .shL .seam-word{left:0}
  .shR .seam-word{left:-100%}
  /* the word opens from a plain black seam — no gold line, no glow (Jacob) */
  .seam-half::after{content:''; position:absolute; top:0; bottom:0; width:1px; background:#000}
  .shL::after{right:0} .shR::after{left:0}
  /* standing line + receipt after the vault seals over the email */
  .seam-line{pointer-events:none; position:absolute; left:50%; top:0; bottom:0; width:1px; margin-left:-.5px; z-index:3;
    background:#000; opacity:0; box-shadow:none}
  .seam-rcv{pointer-events:none; position:absolute; left:50%; top:68%; transform:translateX(-50%); z-index:4;
    font-family:'Cinzel',Georgia,serif; font-weight:600; letter-spacing:.18em; font-size:12px;
    color:var(--gold-hot); opacity:0; white-space:nowrap;
    text-shadow:0 1px 3px #000, 0 2px 14px rgba(0,0,0,.95)}

  /* ---- descent into the vault ---- */
  .descent{position:relative; height:130vh; background:#000}

  /* full-black shroud, driven by scroll progress */
  .shroud{position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:50}

  /* ---- the vault ---- */
  /* pointer-events:none until fully active — during the fade-in a touch-action:none
     surface would otherwise trap touch scrolling mid-descent */
  .vault{position:fixed; inset:0; z-index:60; background:#000; opacity:0; visibility:hidden;
    overflow:hidden; touch-action:none; cursor:grab; outline:none; pointer-events:none;
    -webkit-user-select:none; user-select:none}
  .vault.dragging{cursor:grabbing}
  /* Surface keeps the real archive as the departing layer. Its black backing
     opens onto the prepared card; only the photographs and atmosphere recede. */
  .vault.surface-rising{background:transparent; cursor:default}
  .vault.surface-rising::after{opacity:var(--surface-atmosphere,1)}
  .vault.surface-rising #dive{transform-origin:50% 35%; pointer-events:none}
  /* keyboard users pan this region with arrows — give the focus SOMETHING visible */
  .vault:focus-visible{outline:1px solid var(--gold); outline-offset:-1px}
  /* gold dust (idea 18) — motes drift up under the photos, over the black */
  #dust{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}

  /* vault entry: THE DIVE (flyIn) — no doors. #dive wraps the plane so the dive
     scale/blur never touches the pan math. It RESTS at the sealed depth (small,
     blurred, dim) so anything that reveals the vault early shows the archive far
     below, not a landed frame; flyIn/reset own this state from then on. */
  /* rest = small + dim ONLY — no blur. Brightness is inherited by each bounded
     photo instead of filtering the full 3781×3557 plane as one giant surface. */
  #dive{position:absolute; inset:0; will-change:transform; transform-origin:50% 50%;
    transform:scale(.55); --vault-brightness:.5; z-index:1}
  /* the pass-through flash of the dive — above everything, touched only by flyIn()
     and the Surface exit. Fully opaque at peak (window-light core → near-black edge,
     sampled from the decks photo) so the scroll-jump behind it can never flash through. */
  #flybloom{position:fixed; inset:0; z-index:300; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 42%, #b9b5ae 0%, #35322d 42%, #0a0908 100%)}
  .vault-pan-space{position:absolute; inset:0}
  .vault-plane{position:absolute; top:0; left:0; will-change:transform}
  /* On primary-touch devices the LANDED archive becomes a native 2D scroll node.
     Entry still uses the exact same viewport-sized #dive choreography; this class
     is added only after it has reached scale(1). The explicit scaled pan-space is
     what gives WebKit scroll extents — transformed descendants are not reliable
     scroll geometry on iOS. */
  .vault.native-pan-active{touch-action:auto; cursor:default}
  .vault.native-pan-active #dive{overflow:auto; touch-action:pan-x pan-y pinch-zoom;
    overscroll-behavior:none; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    overflow-anchor:none; transform:scale(1); will-change:auto}
  .vault.native-pan-active #dive::-webkit-scrollbar{display:none; width:0; height:0}
  .vault.native-pan-active .vault-pan-space{position:relative; inset:auto}
  .vault.native-pan-active .vault-plane{will-change:auto}
  .vault-plane img{position:absolute; display:block; height:auto;
    filter:saturate(.92) contrast(1.03) brightness(var(--vault-brightness,1)); background:var(--ink-2);
    border:1px solid rgba(212,175,95,.16); box-shadow:0 18px 50px rgba(0,0,0,.75);
    -webkit-user-drag:none; user-select:none;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.15), box-shadow .45s ease, border-color .45s ease}
  /* hover lift + gold glow (idea 03) — !important so it wins over the inline
     baked rotate/z-index; .hot is set by JS so touch gets it too */
  .vault-plane img.hot{transform:translateY(-12px) rotate(0deg) scale(1.05) !important;
    border-color:var(--gold); z-index:999 !important;
    box-shadow:0 26px 60px rgba(0,0,0,.85), 0 0 36px rgba(212,175,95,.35)}
  /* follow-light swaps .hot constantly during a touch pan — a transition:none
     here turned every swap into a one-frame cut (the mid-pan jitter Jacob hit).
     .18s ease-out: fast enough to track the finger, soft enough to read as a
     hand-off, and no overshoot so re-aimed transitions never pump. Outgoing
     and incoming photos animate SIMULTANEOUSLY (plain transitions already do).
     .gliding too: endDrag drops .dragging BEFORE the inertia glide, and on
     phones the glide IS most of the motion — the slow at-rest .45s overshoot
     bezier got retriggered every 220ms dwell there and pumped. */
  .vault.dragging .vault-plane img, .vault.gliding .vault-plane img{transition:transform .18s ease-out, border-color .18s ease, box-shadow .18s ease}
  /* lighter .hot shadow during drags: growing a 60px blurred shadow on a MOVING
     photo repaints every frame on phones — keep the base shadow, glow only */
  .vault.dragging .vault-plane img.hot, .vault.gliding .vault-plane img.hot{box-shadow:0 18px 50px rgba(0,0,0,.75), 0 0 22px rgba(212,175,95,.3)}
  /* vignette — edges fall into black */
  .vault::after{content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse 72% 62% at 50% 48%, transparent 55%, rgba(0,0,0,.62) 82%, #000 100%)}
  .vault-hud{position:absolute; inset:0; z-index:3; pointer-events:none; display:flex; flex-direction:column;
    justify-content:space-between;
    padding:calc(clamp(20px,4vw,48px) + env(safe-area-inset-top,0px))
      calc(clamp(20px,4vw,48px) + env(safe-area-inset-right,0px))
      calc(clamp(20px,4vw,48px) + env(safe-area-inset-bottom,0px))
      calc(clamp(20px,4vw,48px) + env(safe-area-inset-left,0px))}
  .vault-hud-top{display:flex; justify-content:space-between; align-items:flex-start; letter-spacing:.28em;
    font-size:12px; color:var(--gold); text-transform:uppercase}
  .surface-btn{pointer-events:auto; background:transparent; border:1px solid var(--line); color:var(--gold);
    font-family:'Cascadia Mono',Consolas,monospace; font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    padding:9px 14px; cursor:pointer; border-radius:0; transition:border-color .25s ease, transform .12s ease}
  .surface-btn:hover{border-color:var(--gold)}
  .surface-btn:active{border-color:var(--gold); transform:translateY(1px)}
  /* The old THE V-AULT headline is retired. The incoming VCTRS mark now becomes
     the vault identity itself, with THE VAULT as its quiet descriptor below. */
  .vault-title{position:absolute;left:50%;top:50%;width:clamp(148px,18vw,176px);text-align:center;
    opacity:1;transform:translate(-50%,-50%);pointer-events:none}
  .vault-title.gone{opacity:0!important;transition:opacity .5s ease;pointer-events:none}
  .vault-brand-slot{width:100%;aspect-ratio:766/285}
  .vault-brand-logo,.vault-brand-live{display:block;width:100%;height:100%;background:#f0d492;
    -webkit-mask:url('vctrs-wordmark.svg') center/contain no-repeat;mask:url('vctrs-wordmark.svg') center/contain no-repeat;
    filter:drop-shadow(0 1px 8px rgba(0,0,0,.94)) drop-shadow(0 0 9px rgba(240,212,146,.18))}
  .vault-brand-name{margin-top:clamp(9px,1.5vh,13px);color:var(--gold-hot);opacity:0;transform:translateY(7px);
    font:600 clamp(8px,1vw,11px)/1 'Cinzel',Georgia,serif;letter-spacing:.42em;text-indent:.42em;
    text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .vault-title .rule{width:64px;margin:14px auto 0;transform:scaleX(0);opacity:0}
  .vault-title.revealed .vault-brand-name{animation:vaultIdentityName .34s cubic-bezier(.2,.8,.2,1) both}
  .vault-title.revealed .rule{animation:vaultIdentityRule .42s .2s ease-out both}
  @keyframes vaultIdentityName{to{opacity:1;transform:translateY(0)}}
  @keyframes vaultIdentityRule{to{transform:scaleX(1);opacity:1}}
  .drag-label{align-self:center; color:var(--gold); letter-spacing:.3em; font-size:11px;
    text-transform:uppercase; text-align:center; animation:pulse 2.2s ease-in-out infinite}

  /* phone/tablet vault: legible cue + real tap targets (desktop >=1024 untouched) */
  @media (max-width:768px){
    .surface-btn{min-height:44px; display:inline-flex; align-items:center; padding:11px 16px}
    .drag-label{font-size:10.5px; padding:7px 14px; border-radius:2px;
      background:rgba(11,10,8,.55); text-shadow:0 1px 2px #000, 0 0 12px rgba(0,0,0,.85)}
  }

  /* mobile: 100vh is taller than the visible area under iOS Safari's address bar —
     dvh tracks the real visible viewport (must sit after the vh rules to win) */
  @supports (height:100dvh){
    body.locked{height:100dvh}
    .stage,.seam-stage{height:100dvh}
  }

  @media (prefers-reduced-motion: reduce){
    .drag-label,.guide-cue .g-chev,.signup.bad input[type=email],.signup.done .signed-line,.sgh em,.sgr,.signal-copy,.signal-copy::before,.signal-brand,.seam-gold .signup{animation:none}
    .stagger .l{opacity:1; animation:none}
    .vault-plane img{transition:box-shadow .45s ease, border-color .45s ease}
    .vault-plane img.hot{transform:none !important}
    .vhold,.vh-base,.signup button:active,.flap-play:active,.surface-btn:active{transition:none}
  }

  /* NEXT DROP — the completed film V lifts the next chapter into view. */
  .surface-bar{display:none!important}
  .next-drop{--next-light-cycle:5.4s;position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 50% 44%,rgba(212,175,95,.055),transparent 40%),#070706;
    background-position:center 38%;background-size:cover;background-repeat:no-repeat;
    color:var(--bone);visibility:hidden;transform:translateY(100%) translateZ(0);
    transition:transform 1.25s cubic-bezier(.72,0,.16,1),visibility 0s linear 1.25s}
  .next-drop::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,4,5,.72),rgba(2,4,5,.5) 42%,rgba(2,4,5,.76)),
      radial-gradient(circle at 50% 42%,transparent 0,rgba(0,0,0,.12) 45%,rgba(0,0,0,.48) 100%)}
  .next-drop-card{position:relative;width:min(760px,calc(100vw - 48px));padding:clamp(34px,6vw,72px);
    box-sizing:border-box;z-index:1;text-align:center}
  .next-drop-mark{position:relative;isolation:isolate;width:min(520px,78vw);margin:0 auto;
    opacity:0;transform:translateY(18px)}
  .next-drop-mark::before,.next-drop-mark::after{content:'';position:absolute;inset:-4%;pointer-events:none;
    -webkit-mask:url('vctrs-wordmark.svg') center/contain no-repeat;mask:url('vctrs-wordmark.svg') center/contain no-repeat}
  .next-drop-mark::before{z-index:-1;background:var(--gold-hot);filter:blur(16px);opacity:.1;transform:scale(.99)}
  .next-drop-mark::after{z-index:1;background:linear-gradient(105deg,transparent 26%,rgba(255,255,255,.92) 48%,
    rgba(240,212,146,.95) 53%,transparent 73%);background-size:260% 100%;background-position:130% 0;
    opacity:0}
  .vctrs-glyph{display:block;background:#f7f5ef;
    -webkit-mask:url('vctrs-wordmark.svg') center/contain no-repeat;mask:url('vctrs-wordmark.svg') center/contain no-repeat}
  .next-drop-mark .vctrs-glyph{width:100%;aspect-ratio:766/285;
    filter:drop-shadow(0 0 7px rgba(255,255,255,.18))}
  .next-drop-kicker{margin-top:clamp(22px,4vh,42px);font:600 11px/1 'Cinzel',Georgia,serif;
    letter-spacing:.38em;text-indent:.38em;color:var(--gold-hot);opacity:0;transform:translateY(14px)}
  .next-drop-rule{width:74px;height:1px;margin:25px auto;background:var(--gold-hot);transform:scaleX(0)}
  .next-drop-title{margin:0;font:500 clamp(30px,5vw,58px)/1.02 'Cinzel',Georgia,serif;
    letter-spacing:.025em;color:var(--bone);opacity:0;transform:translateY(14px)}
  .next-drop-email{width:min(460px,100%);margin:clamp(30px,5vh,52px) auto 0;opacity:0;transform:translateY(12px)}
  .next-drop-email label{display:block;margin-bottom:12px;font:10px/1 'Cascadia Mono',Consolas,monospace;
    letter-spacing:.24em;color:rgba(239,233,220,.58)}
  .next-drop-email-row{display:flex;border:1px solid rgba(239,233,220,.34);background:rgba(0,0,0,.22)}
  .next-drop-email input{min-width:0;flex:1;border:0;background:transparent;color:var(--bone);padding:15px 16px;
    outline:0;font:16px/1 'Cascadia Mono',Consolas,monospace}
  .next-drop-email input::placeholder{color:rgba(239,233,220,.35)}
  .next-drop-email button{border:0;border-left:1px solid rgba(212,175,95,.38);background:transparent;
    color:var(--gold-hot);padding:0 20px;cursor:pointer;font:700 11px/1 'Cinzel',Georgia,serif;letter-spacing:.18em}
  .next-drop-email:focus-within .next-drop-email-row{border-color:var(--gold-hot)}
  .next-drop-email button:focus-visible,.next-drop-email input:focus-visible{outline:1px solid var(--gold-hot);outline-offset:3px}
  .next-drop-result{min-height:14px;padding-top:10px;color:var(--gold-hot);
    font:9px/1 'Cascadia Mono',Consolas,monospace;letter-spacing:.16em}
  .next-vault-hold{width:min(460px,100%);margin:18px auto 0;min-height:76px;
    padding:12px;font-size:17px;letter-spacing:.1em;text-indent:.1em;
    background:linear-gradient(135deg,#f0d492,#d4af5f);border:1px solid #f3dfa7;color:#100e09;
    box-shadow:0 5px 24px rgba(212,175,95,.16);
    opacity:0;transform:translateY(12px);pointer-events:none}
  .next-vault-hold:hover{background:linear-gradient(135deg,#f5dfad,#e2be72)}
  /* A sharp metallic pressure face: never fade or scale the lettering.
     Confirmation finishes within 280ms, before the card starts its exit. */
  .next-vault-hold::after{content:'';position:absolute;inset:3px;z-index:1;pointer-events:none;
    border:1px solid rgba(255,247,218,.88);border-radius:1px;opacity:0;
    background:linear-gradient(180deg,rgba(255,250,225,.38),transparent 28%,transparent 70%,rgba(91,54,8,.12)),
      radial-gradient(ellipse at 50% 100%,rgba(255,246,207,.48),transparent 72%);
    box-shadow:inset 0 1px 0 rgba(255,255,240,.55),inset 0 -1px 0 rgba(98,57,9,.16);
    transition:opacity .09s ease-out}
  .next-vault-hold:active,body.next-vault-opening .next-vault-hold{
    background:linear-gradient(115deg,#d2a454 0%,#eaca89 32%,#f2d99b 51%,#d7af64 78%,#c69748 100%);
    border-color:#ffedba;
    box-shadow:inset 0 2px 5px rgba(62,38,7,.28),inset 0 -1px 0 rgba(255,245,208,.45),
      0 2px 10px rgba(212,175,95,.2),0 0 24px rgba(240,212,146,.18)}
  .next-vault-hold:active::after,body.next-vault-opening .next-vault-hold::after{opacity:1}
  .next-vault-hold .vh-base{transition:transform .09s ease-out;text-shadow:0 1px 0 rgba(255,248,220,.22)}
