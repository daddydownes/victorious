<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VCTRS — Natural Vault Entry Studies</title>
<style>
  :root{--ink:#070706;--bone:#efe9dc;--gold:#d4af5f;--hot:#f0d492}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#030303;color:var(--bone);font-family:Consolas,"Cascadia Mono",monospace}
  body{padding:clamp(18px,4vw,52px)}
  header{max-width:1180px;margin:0 auto 26px;display:flex;justify-content:space-between;align-items:end;gap:20px}
  h1{margin:0;font:500 clamp(18px,2.4vw,28px)/1.1 Georgia,serif;letter-spacing:.08em}
  header p{margin:0;color:rgba(239,233,220,.48);font-size:10px;letter-spacing:.18em;text-align:right}
  main{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,34px)}
  article{min-width:0}
  .frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#050505;border:1px solid rgba(212,175,95,.22);isolation:isolate}
  .vault{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12%;opacity:0;transform:scale(.76);filter:brightness(.35)}
  .tile{background:linear-gradient(145deg,#232323,#090909);border:1px solid rgba(239,233,220,.12)}
  .tile:nth-child(2),.tile:nth-child(6){transform:translateY(14%)}
  .tile:nth-child(4){grid-column:span 2}
  .vault::after{display:none}
  .vault-title-demo{position:absolute;left:50%;top:50%;z-index:6;width:62%;opacity:0;
    transform:translate(-50%,-50%) scale(.9);text-align:center}
  .vault-final-mark{display:block;width:100%;height:auto;filter:brightness(0) invert(91%) sepia(22%) saturate(650%) hue-rotate(345deg)
    drop-shadow(0 1px 8px rgba(0,0,0,.94)) drop-shadow(0 0 9px rgba(212,175,95,.18))}
  .vault-final-name{margin-top:12px;color:var(--hot);font:600 9px/1 Georgia,serif;
    letter-spacing:.42em;text-indent:.42em;text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .vault-title-demo::after{content:'';display:block;width:72px;height:1px;margin:14px auto 0;
    background:rgba(212,175,95,.55);transform:scaleX(0);transform-origin:center}
  .mark{position:absolute;left:50%;top:42%;width:72%;transform:translate(-50%,-50%);z-index:5}
  .mark img{display:block;width:100%;filter:brightness(0) invert(91%) sepia(25%) saturate(760%) hue-rotate(345deg) drop-shadow(0 0 10px rgba(240,212,146,.5))}
  .ray{position:absolute;left:50%;top:50%;z-index:3;width:44%;height:1px;background:linear-gradient(90deg,transparent,var(--hot),transparent);opacity:0;transform-origin:left center}
  .flash{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;z-index:4;opacity:0;transform:translate(-50%,-50%) scale(0);background:#fff5d6}
  .beam{position:absolute;left:50%;top:50%;z-index:3;width:1px;height:120%;opacity:0;transform:translate(-50%,-50%) scaleY(0);background:linear-gradient(transparent,var(--hot),transparent)}
  .caption{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:12px}
  .label b{display:block;color:var(--hot);font:600 11px/1 Georgia,serif;letter-spacing:.18em}
  .label span{display:block;margin-top:6px;color:rgba(239,233,220,.46);font-size:9px;letter-spacing:.12em}
  button{border:1px solid rgba(212,175,95,.5);background:transparent;color:var(--hot);padding:10px 14px;cursor:pointer;font:10px/1 Consolas,monospace;letter-spacing:.16em}
  button:hover,button:focus-visible{border-color:var(--hot);outline:none;box-shadow:0 0 16px rgba(212,175,95,.16)}

  /* A — controlled, soft and compact. */
  .run.a .mark{animation:aMark 2.05s cubic-bezier(.5,0,.16,1) both}
  .run.a .flash{animation:aBloom 2.05s ease both;box-shadow:0 0 24px #fff5d6,0 0 70px rgba(240,212,146,.88),0 0 150px rgba(212,175,95,.42)}
  .run.a .vault{animation:vaultLand 2.05s cubic-bezier(.16,.8,.2,1) both}
  .run.a .ray{animation:aRay 1.15s .62s ease-out both}
  .a .ray:nth-of-type(1){transform:rotate(0)}.a .ray:nth-of-type(2){transform:rotate(45deg)}
  .a .ray:nth-of-type(3){transform:rotate(90deg)}.a .ray:nth-of-type(4){transform:rotate(135deg)}
  @keyframes aMark{0%,18%{transform:translate(-50%,-50%) scale(1);opacity:1}38%{transform:translate(-50%,-50%) scale(1.055);opacity:1}
    72%{transform:translate(-50%,-50%) scale(.2);opacity:1;filter:drop-shadow(0 0 26px rgba(240,212,146,.9))}
    100%{transform:translate(-50%,-50%) scale(.035);opacity:0}}
  @keyframes aBloom{0%,48%{opacity:0;transform:translate(-50%,-50%) scale(0)}64%{opacity:.92;transform:translate(-50%,-50%) scale(1.8)}
    82%{opacity:.42;transform:translate(-50%,-50%) scale(7)}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}
  @keyframes aRay{0%{opacity:0;scale:0 1}32%{opacity:.68}75%{opacity:.22;scale:1 1}100%{opacity:0;scale:.2 1}}

  /* B — faster, sharper, more photographic-flash energy. */
  .run.b .mark{animation:bMark 1.72s cubic-bezier(.58,0,.12,1) both}
  .run.b .flash{animation:bFlash 1.72s cubic-bezier(.3,0,.2,1) both;box-shadow:0 0 16px #fff,0 0 48px #fff1bd,0 0 120px rgba(240,212,146,.9),0 0 260px rgba(212,175,95,.55)}
  .run.b .beam{animation:bBeam 1.72s ease both;box-shadow:0 0 12px rgba(240,212,146,.9),0 0 40px rgba(212,175,95,.52)}
  .run.b .vault{animation:vaultLand 1.72s cubic-bezier(.16,.8,.2,1) both}
  .run.b .ray{animation:bRay 1.05s .34s ease-out both}
  .b .ray:nth-of-type(1){transform:rotate(18deg)}.b .ray:nth-of-type(2){transform:rotate(72deg)}
  .b .ray:nth-of-type(3){transform:rotate(108deg)}.b .ray:nth-of-type(4){transform:rotate(162deg)}
  @keyframes bMark{0%,12%{transform:translate(-50%,-50%) scale(1);opacity:1}30%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
    62%{transform:translate(-50%,-50%) scale(.11);opacity:1;filter:drop-shadow(0 0 42px rgba(255,245,214,1))}
    100%{transform:translate(-50%,-50%) scale(.025);opacity:0}}
  @keyframes bFlash{0%,38%{opacity:0;transform:translate(-50%,-50%) scale(0)}54%{opacity:1;transform:translate(-50%,-50%) scale(2.2)}
    68%{opacity:.8;transform:translate(-50%,-50%) scale(9)}100%{opacity:0;transform:translate(-50%,-50%) scale(34)}}
  @keyframes bBeam{0%,32%{opacity:0;transform:translate(-50%,-50%) scaleY(0)}52%{opacity:1}76%{opacity:.55;transform:translate(-50%,-50%) scaleY(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleY(.1)}}
  @keyframes bRay{0%{opacity:0;scale:0 1}24%{opacity:1}66%{opacity:.62;scale:1.35 1}100%{opacity:0;scale:.05 1}}
  @keyframes vaultLand{0%,34%{opacity:0;transform:scale(.76);filter:brightness(.28)}70%{opacity:.72;transform:scale(1.035);filter:brightness(.76)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}

  /* Realistic pass: no graphic rays or beam. The mark recedes with believable
     momentum while the vault catches one soft change in exposure. */
  .ray,.beam{display:none!important}
  .flash{width:34%;height:auto;aspect-ratio:1;background:radial-gradient(circle,
    rgba(255,245,216,.78) 0,rgba(225,190,111,.3) 18%,rgba(177,130,48,.08) 48%,transparent 72%);
    filter:blur(8px);box-shadow:none!important}
  .run.a .mark{animation:naturalDepth 2.25s cubic-bezier(.52,.02,.18,1) both}
  .run.a .flash{animation:naturalLight 2.25s ease-out both}
  .run.a .vault{animation:naturalVault 2.25s cubic-bezier(.22,.72,.24,1) both}
  .run.a .vault-title-demo{animation:naturalTitle 2.25s cubic-bezier(.22,.72,.24,1) both}
  .run.a .vault-title-demo::after{animation:titleRule 2.25s ease both}
  .run.b .mark{animation:cameraDepth 1.9s cubic-bezier(.58,.01,.16,1) both}
  .run.b .flash{animation:cameraLight 1.9s ease-out both;filter:blur(11px)}
  .run.b .vault{animation:cameraVault 1.9s cubic-bezier(.2,.78,.24,1) both}
  .run.b .vault-title-demo{animation:cameraTitle 1.9s cubic-bezier(.2,.78,.24,1) both}
  .run.b .vault-title-demo::after{animation:titleRule 1.9s ease both}
  @keyframes naturalDepth{
    0%,16%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:blur(0)}
    42%{transform:translate(-50%,-47%) scale(.92);opacity:1;filter:blur(0)}
    76%{transform:translate(-50%,-40%) scale(.16);opacity:.96;filter:blur(.35px)}
    100%{transform:translate(-50%,-34%) scale(.045);opacity:0;filter:blur(1.8px)}}
  @keyframes naturalLight{
    0%,54%{opacity:0;transform:translate(-50%,-50%) scale(.08)}
    72%{opacity:.7;transform:translate(-50%,-50%) scale(.62)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}
  @keyframes naturalVault{
    0%,34%{opacity:0;transform:scale(.84);filter:brightness(.28)}
    74%{opacity:.9;transform:scale(1.012);filter:brightness(.82)}
    100%{opacity:1;transform:scale(1);filter:brightness(1)}}
  @keyframes naturalTitle{
    0%,66%{opacity:0;transform:translate(-50%,-50%) scale(.82);letter-spacing:.29em}
    80%{opacity:.82}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:.2em}}
  @keyframes cameraDepth{
    0%,12%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:blur(0)}
    34%{transform:translate(-50%,-46%) scale(.96);opacity:1;filter:blur(0)}
    68%{transform:translate(-50%,-38%) scale(.12);opacity:1;filter:blur(.55px)}
    100%{transform:translate(-50%,-31%) scale(.035);opacity:0;filter:blur(2.2px)}}
  @keyframes cameraLight{
    0%,49%{opacity:0;transform:translate(-50%,-50%) scale(.06)}
    67%{opacity:.84;transform:translate(-50%,-50%) scale(.48)}
    82%{opacity:.2;transform:translate(-50%,-50%) scale(.9)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
  @keyframes cameraVault{
    0%,29%{opacity:0;transform:scale(.82);filter:brightness(.22)}
    69%{opacity:1;transform:scale(1.018);filter:brightness(1.12)}
    100%{opacity:1;transform:scale(1);filter:brightness(1)}}
  @keyframes cameraTitle{
    0%,57%{opacity:0;transform:translate(-50%,-50%) scale(.86);letter-spacing:.26em}
    72%{opacity:1}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:.2em}}
  @keyframes titleRule{0%,72%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
  @media(max-width:760px){main{grid-template-columns:1fr}.frame{aspect-ratio:9/12}header{align-items:start}header p{max-width:140px}}
  @media(prefers-reduced-motion:reduce){.mark{opacity:0}.vault{opacity:1;transform:none;filter:none}.flash,.beam,.ray{display:none}}
</style>
</head>
<body>
<header><h1>VAULT ENTRY — NATURAL IMPACT</h1><p>TWO RESTRAINED STUDIES · MAIN SITE UNCHANGED</p></header>
<main>
  <article>
    <div class="frame a" id="demoA">
      <div class="vault"><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i></div>
      <span class="ray"></span><span class="ray"></span><span class="ray"></span><span class="ray"></span>
      <div class="flash"></div><div class="mark"><img src="vctrs-wordmark.svg" alt="VCTRS"></div>
      <div class="vault-title-demo"><img class="vault-final-mark" src="vctrs-wordmark.svg" alt="VCTRS"><div class="vault-final-name">THE VAULT</div></div>
    </div>
    <div class="caption"><div class="label"><b>A · NATURAL DEPTH</b><span>SLOWER · WEIGHTED · ALMOST NO EFFECT</span></div><button data-demo="demoA">REPLAY A</button></div>
  </article>
  <article>
    <div class="frame b" id="demoB">
      <div class="vault"><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i></div>
      <span class="ray"></span><span class="ray"></span><span class="ray"></span><span class="ray"></span>
      <div class="beam"></div><div class="flash"></div><div class="mark"><img src="vctrs-wordmark.svg" alt="VCTRS"></div>
      <div class="vault-title-demo"><img class="vault-final-mark" src="vctrs-wordmark.svg" alt="VCTRS"><div class="vault-final-name">THE VAULT</div></div>
    </div>
    <div class="caption"><div class="label"><b>B · CAMERA EXPOSURE</b><span>QUICKER · CLEAN LIGHT · NO GRAPHIC BURST</span></div><button data-demo="demoB">REPLAY B</button></div>
  </article>
</main>
<script>
  function play(id){var el=document.getElementById(id);el.classList.remove('run');void el.offsetWidth;el.classList.add('run')}
  document.querySelectorAll('button[data-demo]').forEach(function(btn){btn.addEventListener('click',function(){play(btn.dataset.demo)})});
  setTimeout(function(){play('demoA');play('demoB')},250);
</script>
</body>
</html>
