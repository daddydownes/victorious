name: Safari keyboard fallback comparison
on:
  push:
    branches: [fix/safari-scroll-20260927]
    paths: ['.github/workflows/safari-fallback-audit.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cc815385947421c0f88f5c273b33cc2f52b0ca18
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the exact tested candidate
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          node tools/apply-safari-scroll-fix.cjs
          node tools/build-guided.cjs
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install webkit
      - name: Repeat no-API fallback on both sources
        run: |
          node -e "require('./tools/serve-demo.cjs').createDemoServer().server.listen(8921,'127.0.0.1')" > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8921/ > /dev/null && break; sleep 1; done
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),{webkit}=require('playwright');
          const out=process.env.EVIDENCE_DIR,rows=[],original=cp.execFileSync('git',['show','bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a:index.html'],{encoding:'utf8',maxBuffer:5e6});
          const save=()=>fs.writeFileSync(path.join(out,'fallback-comparison.json'),JSON.stringify({method:'macOS WebKit with VisualViewport deliberately removed; not a physical keyboard',rows},null,2));
          async function snapshot(p){return p.evaluate(()=>{const rect=e=>e.getBoundingClientRect().toJSON(),a=nextDrop.getBoundingClientRect(),b=nextDropEmailInput.getBoundingClientRect(),c=nextDropResult.getBoundingClientRect();return{panel:rect(nextDrop),input:rect(nextDropEmailInput),result:rect(nextDropResult),scroll:nextDrop.scrollTop,active:document.activeElement.id,visible:b.top>=a.top-1&&c.bottom<=a.bottom+1}})}
          (async()=>{const browser=await webkit.launch();try{for(let pass=1;pass<=4;pass++)for(const variant of ['baseline','candidate']){
            const context=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await context.route('**/formsubmit.co/**',r=>r.fulfill({json:{success:true}}));
            if(variant==='baseline')await context.route(url=>url.pathname==='/'&&url.searchParams.has('fallback-audit'),r=>r.fulfill({contentType:'text/html',body:original}));
            await context.addInitScript(()=>Object.defineProperty(window,'visualViewport',{value:undefined}));
            const page=await context.newPage(),row={variant,pass,errors:[]};rows.push(row);page.on('pageerror',e=>row.errors.push(e.message));
            try{
              await page.goto('http://127.0.0.1:8921/?fallback-audit='+variant+'-'+pass,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!nextDrop.inert);
              await page.locator('#nextDropEmailInput').fill('viewport@example.invalid');
              await page.waitForFunction(()=>{const panel=nextDrop.getBoundingClientRect(),input=nextDropEmailInput.getBoundingClientRect(),receipt=nextDropResult.getBoundingClientRect();return input.top>=panel.top&&receipt.bottom<=panel.bottom-11});
              row.before=await snapshot(page);
              await page.setViewportSize({width:390,height:300});await page.waitForTimeout(100);row.at100ms=await snapshot(page);
              await page.waitForTimeout(500);row.at600ms=await snapshot(page);
              if(pass===1)await page.screenshot({path:path.join(out,variant+'-fallback.png')});
              await page.setViewportSize({width:390,height:844});await page.locator('#nextDropEmailInput').blur();await page.waitForTimeout(150);row.restored=await snapshot(page);
            }catch(e){row.error=e.stack}finally{save();await context.close()}
          }}finally{await browser.close()}console.log(JSON.stringify(rows.map(r=>({variant:r.variant,pass:r.pass,visible100:r.at100ms?.visible,visible600:r.at600ms?.visible,error:r.error})),null,2));if(rows.some(r=>r.error||r.errors.length))process.exitCode=1})().catch(e=>{console.error(e);save();process.exitCode=1});
          JS
      - name: Upload exact fallback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-keyboard-fallback-comparison
          path: ${{ runner.temp }}/evidence
          retention-days: 7
