name: Safari native review
on:
  push:
    branches: [fix/safari-preserve-design-20260927]
permissions: {contents: read}
concurrency:
  group: safari-native-review
  cancel-in-progress: true
env:
  REPAIR_REF: b785be9350dcd42a6262c39195f75e30da45a984
jobs:
  classify-original:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: chromium-320-568, engine: chromium, suite: entry-scroll-browser, pattern: spam}
          - {case: chromium-844-390, engine: chromium, suite: entry-scroll-browser, pattern: normal}
          - {case: chromium-390-844-reduce, engine: chromium, suite: entry-scroll-browser, pattern: spam}
          - {case: webkit-390-844, engine: webkit, suite: vault-polish-browser, pattern: normal}
          - {case: webkit-844-390, engine: webkit, suite: vault-polish-browser, pattern: normal}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install same browser and retain original source
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }} >> "$RUNNER_TEMP/evidence/install.log" 2>&1
          sha256sum index.html > "$RUNNER_TEMP/evidence/source.sha256"
      - name: Reproduce original test outcome without changing assertions
        env:
          QA_CASE: ${{ matrix.case }}
          QA_PATTERN: ${{ matrix.pattern }}
          QA_PASSES: '1'
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          sleep 1
          set +e
          BASE_URL=http://127.0.0.1:8921/ EVIDENCE_DIR="$RUNNER_TEMP/evidence" node tests/${{ matrix.suite }}.cjs > "$RUNNER_TEMP/evidence/test.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/evidence/exit-code.txt"
          cat "$RUNNER_TEMP/evidence/test.log"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-classification-${{ matrix.case }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
  preserved-journeys:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: chromium-320-568, engine: chromium}
          - {case: chromium-844-390, engine: chromium}
          - {case: chromium-390-844-reduce, engine: chromium}
          - {case: webkit-390-844, engine: webkit}
          - {case: webkit-844-390, engine: webkit}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare candidate and browsers
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp index.html baseline.html
          git show "$REPAIR_REF:tools/apply-safari-scroll-fix.cjs" > "$RUNNER_TEMP/apply.cjs"
          node "$RUNNER_TEMP/apply.cjs"
          node tools/build-guided.cjs
          test "$(sha256sum index.html | cut -d' ' -f1)" = e54e83d476b7d7aff2254044358e1a1d3afd26f9ce06845fb8c35375dde95157
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }} >> "$RUNNER_TEMP/evidence/install.log" 2>&1
      - name: Original and candidate repeated input journeys
        env:
          QA_CASE: ${{ matrix.case }}
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          sleep 1
          BASE_URL=http://127.0.0.1:8921/baseline.html VARIANT=original EVIDENCE_DIR="$RUNNER_TEMP/evidence/original" node tests/safari-preserved-journey.cjs
          BASE_URL=http://127.0.0.1:8921/ VARIANT=repaired EVIDENCE_DIR="$RUNNER_TEMP/evidence/repaired" node tests/safari-preserved-journey.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-journeys-${{ matrix.case }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
  save-candidate:
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Save exact Safari-tested candidate only to isolated branch
        run: |
          test "$GITHUB_REF_NAME" = fix/safari-preserve-design-20260927
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git show "$REPAIR_REF:tools/apply-safari-scroll-fix.cjs" > "$RUNNER_TEMP/apply.cjs"
          git show "$REPAIR_REF:tests/entry-scroll-performance-unit.cjs" > tests/entry-scroll-performance-unit.cjs
          node "$RUNNER_TEMP/apply.cjs"
          node tools/build-guided.cjs
          test "$(sha256sum index.html | cut -d' ' -f1)" = e54e83d476b7d7aff2254044358e1a1d3afd26f9ce06845fb8c35375dde95157
          node tests/entry-scroll-scope.cjs
          node tests/entry-scroll-performance-unit.cjs
          git diff --check
          git config user.name 'VCTRS performance review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/guided/journey.js tools/guided/journey.css tests/entry-scroll-performance-unit.cjs
          git commit -m 'Save conservative Safari performance candidate; release held pending edge-case classification [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
