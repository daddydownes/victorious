name: Safari native review
on:
  push:
    branches: [fix/safari-preserve-design-20260927]
permissions:
  contents: read
concurrency:
  group: safari-native-review
  cancel-in-progress: true
env:
  REPAIR_REF: b785be9350dcd42a6262c39195f75e30da45a984
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: chromium-390-844, engine: chromium, suite: entry-scroll-browser}
          - {case: chromium-320-568, engine: chromium, suite: entry-scroll-browser}
          - {case: chromium-844-390, engine: chromium, suite: entry-scroll-browser}
          - {case: chromium-1440-900, engine: chromium, suite: entry-scroll-browser}
          - {case: chromium-390-844-reduce, engine: chromium, suite: entry-scroll-browser}
          - {case: chromium-1440-900-reduce, engine: chromium, suite: entry-scroll-browser}
          - {case: webkit-390-844, engine: webkit, suite: vault-polish-browser}
          - {case: webkit-844-390, engine: webkit, suite: vault-polish-browser}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build exact reviewed candidate
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git show "$REPAIR_REF:tools/apply-safari-scroll-fix.cjs" > "$RUNNER_TEMP/apply.cjs"
          git show "$REPAIR_REF:tests/entry-scroll-performance-unit.cjs" > tests/entry-scroll-performance-unit.cjs
          node "$RUNNER_TEMP/apply.cjs"
          node tools/build-guided.cjs
          node tests/entry-scroll-performance-unit.cjs | tee "$RUNNER_TEMP/evidence/unit.txt"
          node tests/entry-scroll-scope.cjs
          for file in guided-source reveal post-surface-scroll press-feedback surface-input surface-recovery guided-scroll vault-spatial-layout flappy-difficulty flappy-collision flappy-lifecycle flappy-death; do node "tests/$file.cjs"; done
          sha256sum index.html > "$RUNNER_TEMP/evidence/source.sha256"
          git diff --check
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8921/" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }} >> "$RUNNER_TEMP/evidence/install.log" 2>&1
      - name: Four consecutive journeys
        env:
          QA_CASE: ${{ matrix.case }}
          QA_PASSES: '4'
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          sleep 1
          node tests/${{ matrix.suite }}.cjs
      - name: Signup geometry regression
        if: matrix.case == 'chromium-390-844' || matrix.case == 'webkit-390-844'
        env:
          TEST_ENGINE: ${{ matrix.engine }}
        run: node tests/signup-viewport-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-regression-${{ matrix.case }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
  native-safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare original and repaired pages
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp index.html baseline.html
          git show "$REPAIR_REF:tools/apply-safari-scroll-fix.cjs" > "$RUNNER_TEMP/apply.cjs"
          git show "$REPAIR_REF:tests/safari-native-scroll.py" > "$RUNNER_TEMP/native.py"
          node "$RUNNER_TEMP/apply.cjs"
          node tools/build-guided.cjs
          python3 - <<'PY'
          import os,pathlib
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'native.py'
          text=file.read_text()
          start=text.index('    variants = {')
          end=text.index('    for variant, css in variants.items():',start)
          text=text[:start]+"    variants = {'baseline': ''}\n"+text[end:]
          text=text.replace("    rows.append({'hero': hero", "    assert hero['duration'] and hero['time'] >= hero['duration']-.15, 'Hero did not finish'\n    rows.append({'hero': hero")
          file.write_text(text)
          PY
          shasum -a 256 index.html > "$RUNNER_TEMP/evidence/source.sha256"
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --version | tee "$RUNNER_TEMP/evidence/safari-version.txt"
      - name: Compare actual Safari and repeat repaired journey four times
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8921/baseline.html EVIDENCE_DIR="$RUNNER_TEMP/evidence/original" python3 "$RUNNER_TEMP/native.py"
          for pass in 1 2 3 4; do
            BASE_URL=http://127.0.0.1:8921/ EVIDENCE_DIR="$RUNNER_TEMP/evidence/repaired-$pass" python3 "$RUNNER_TEMP/native.py"
            sleep 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-safari-before-after
          path: ${{ runner.temp }}/evidence
          retention-days: 7
  commit-candidate:
    needs: [browser, native-safari]
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Commit only the tested source candidate, never deploy main
        run: |
          test "$GITHUB_REF_NAME" = fix/safari-preserve-design-20260927
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git show "$REPAIR_REF:tools/apply-safari-scroll-fix.cjs" > "$RUNNER_TEMP/apply.cjs"
          git show "$REPAIR_REF:tests/entry-scroll-performance-unit.cjs" > tests/entry-scroll-performance-unit.cjs
          node "$RUNNER_TEMP/apply.cjs"
          node tools/build-guided.cjs
          node tests/entry-scroll-scope.cjs
          node tests/entry-scroll-performance-unit.cjs
          git diff --check
          git config user.name 'VCTRS performance review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/guided/journey.js tools/guided/journey.css tests/entry-scroll-performance-unit.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Reduce hidden animation and scroll measurement work without retuning the journey [skip ci]'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
