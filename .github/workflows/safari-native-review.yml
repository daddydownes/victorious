name: Safari live source verification
on:
  push:
    branches: [fix/safari-preserve-design-20260927]
permissions: {contents: read}
jobs:
  verify-live:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 965985284f3f750dd5f27b873872fad30ac8f2ec
      - name: Match canonical homepage to deployed source without changing anything
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          source=pathlib.Path('index.html').read_bytes().replace(b'\r\n',b'\n')
          expected=hashlib.sha256(source).hexdigest()
          assert expected=='bfef4d4b086834c074274d12bc2e97d93004b99c619ac2dc2c6e13c1e04ce67e'
          result={}
          for attempt in range(6):
              with urllib.request.urlopen('https://vctrsclo.com/',timeout=25) as response:
                  live=response.read().replace(b'\r\n',b'\n')
                  result={'url':response.url,'status':response.status,'releaseCommit':'965985284f3f750dd5f27b873872fad30ac8f2ec','sha256':hashlib.sha256(live).hexdigest(),'matchesRelease':live==source,'checkedAtUtc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
              if result['matchesRelease']:break
              time.sleep(5)
          pathlib.Path('live-verification.json').write_text(json.dumps(result,indent=2))
          print('LIVE_VERIFICATION',json.dumps(result))
          assert result['matchesRelease'],'Live homepage does not yet match the released code'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-safari-source-verification
          path: live-verification.json
          retention-days: 7
