name: Safari native review
on:
  push:
    branches: [fix/safari-preserve-design-20260927]
permissions: {contents: write}
jobs:
  package-unpublished-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Package source only; leave main and production untouched
        run: |
          set -euo pipefail
          target=review/safari-preserved-performance-20260927
          test -z "$(git ls-remote --heads origin "$target")"
          git checkout -B "$target" bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a
          git restore --source=50b28f95638097eadc36a2a01c471d1b454cacfe -- index.html tools/guided/journey.js tools/guided/journey.css tests/entry-scroll-performance-unit.cjs
          test "$(sha256sum index.html | cut -d' ' -f1)" = e54e83d476b7d7aff2254044358e1a1d3afd26f9ce06845fb8c35375dde95157
          node tests/entry-scroll-performance-unit.cjs
          node tests/entry-scroll-scope.cjs
          node tests/guided-source.cjs
          mkdir -p docs/reviews
          cat > docs/reviews/safari-performance-2026-09-27.md <<'REPORT'
          # Safari performance repair — unpublished candidate

          ## Release status
          **Do not merge as a fully verified lag fix.** Runtime changes are saved and scoped, but the complete phone regression matrix is not green. Main and the live website were intentionally left unchanged by this review. The owner authorized performance fixes provided the look and feel remain unchanged.

          Baseline: `bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a`.
          Tested implementation: `50b28f95638097eadc36a2a01c471d1b454cacfe` on the isolated diagnostic branch.
          Exact candidate homepage SHA-256: `e54e83d476b7d7aff2254044358e1a1d3afd26f9ce06845fb8c35375dde95157`.
          Original homepage SHA-256: `d6a2886dd3e69e615504e8844f1d39287f46b4b48c7750407424e705cb6f7ad8`.

          ## Changes
          `tools/guided/journey.js` caches pre-Vault section geometry instead of repeatedly measuring unchanged rectangles during each scrolling frame. Layout is invalidated by observed section resizing, viewport resize, font readiness, visibility restoration, panel exposure and reduced-motion changes. Browsers without ResizeObserver retain fresh measurement rather than using an unsafe permanent cache.

          `tools/guided/journey.css` pauses CSS animations only inside the explicitly aria-hidden legacy `.seam-gold` subtree. This includes the unused scanning text effect. The visible collection, signup, photographs, video and other decorative effects are not disabled.

          `index.html` is regenerated by the current guided builder. No gesture thresholds, direction handling, animation durations/easing, content, media, game physics or hosting files are changed. The source/scope guards confirm that the root archive, hero, Surface, story/game and form transport remain unchanged outside the entry sources. Temporary diagnostic effects and workflows are deliberately excluded from this review branch.

          ## Verified results
          Actions run [36307523418](https://github.com/daddydownes/victorious/actions/runs/36307523418) exercised the exact candidate.

          - **Actual desktop Safari 26.6.1 on hosted macOS 15.7.9:** original journey once and candidate journey four times, with the automatic opening reaching its final frames, signup, overview and Vault entry. All four candidate journeys passed. This is Safari WebDriver on a hosted Mac, not a physical iPhone or the owner's Mac.
          - **Visual snapshots:** all four candidate signup and landed-Vault screenshots were pixel-identical to their original Safari snapshots. Collection snapshots differed only by very small animation-phase pixel values, with no channel difference above 10/255. These are sampled states, not proof of every animation frame.
          - **Controller comparison:** 725 baseline-matched simulated frame states across normal travel, repeated input, reversal, resize and content reflow. The normal case measured 600 geometry reads in the original versus 3 in the candidate. This measures eliminated work, not a 200-times faster website.
          - **Existing Chromium journeys:** four passes each at 390x844, 1440x900 and 1440x900 reduced motion completed the journey matrix. Static scope, build, source, Surface, reveal, press and game regression checks passed.

          ## Failures and limits — retained, not hidden
          The same run failed narrow-phone rapid-input, reduced-motion rapid-input, landscape form-focus and WebKit preview checks. These must not be described as a green full release matrix.

          Actions run [36307888880](https://github.com/daddydownes/victorious/actions/runs/36307888880) replayed unchanged tests against the byte-verified original. Chromium 320x568 rapid approach failed the same overview assertion; Chromium 390x844 reduced motion failed the same first-stop assertion; Chromium 844x390 failed the same form-focus return assertion. The WebKit portrait preview check also timed out at the same existing test line on the original. This establishes that those failures were not introduced solely by the candidate, but does not resolve whether each is a harness assumption or an existing interaction defect. Supplementary new journey probes also failed on the original before reaching candidate comparison; they are not counted as passes.

          Native Safari still recorded occasional long frames around photographic overview/zoom. The repair reduces redundant layout queries; a consistent end-to-end frame-rate improvement and elimination of the owner's reported lag have **not** been established. Exploratory Linux rendering ablations are not treated as a reliable speed benchmark, and none of their visible-effect removals is included here.

          No real signup was submitted. No physical iPhone, embedded browser or user's-device performance profile was obtained.

          ## Next validation
          Identify whether the observed lag is macOS Safari or iPhone Safari and which section exhibits it (collection/signup, overview zoom, interactive archive, or after Surface). Capture that specific scroll with Safari's timeline on the affected device. Resolve the phone edge-case tests and compare the final candidate again before merging. Preserve the intended stepwise gesture navigation rather than silently retuning it.
          REPORT
          python3 - <<'PY'
          from pathlib import Path
          file=Path('docs/STATUS.md')
          text=file.read_text()
          header='''## September 27 — Safari performance candidate; not published

          The isolated review branch `review/safari-preserved-performance-20260927` contains pre-Vault geometry caching, hidden legacy-animation suspension, regenerated homepage and a 725-frame equivalence regression test. No visible design, media or gesture tuning is changed. Four actual desktop Safari journeys and selected repeated Chromium journeys pass; sampled Safari signup and Vault screenshots match the original exactly. The full phone regression matrix remains non-green, with several failures reproduced unchanged on the original. This candidate is **not approved as an eliminated-lag fix and is not published**. See [the evidence and remaining work](reviews/safari-performance-2026-09-27.md). The next task is to identify the owner's affected Safari/device/section and resolve the remaining mobile checks without changing the look and feel.

          '''
          assert text.startswith('# Current status\n')
          file.write_text(text.replace('# Current status\n','# Current status\n\n'+header,1))
          PY
          git diff --check
          git config user.name 'VCTRS performance review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/guided/journey.js tools/guided/journey.css tests/entry-scroll-performance-unit.cjs docs/STATUS.md docs/reviews/safari-performance-2026-09-27.md
          git diff --cached --stat
          git commit -m 'Prepare visual-preserving Safari performance repair with explicit test limitations'
          git push origin "HEAD:refs/heads/$target"
          echo "UNPUBLISHED_REVIEW_COMMIT=$(git rev-parse HEAD)"
