name: Normal-motion native Safari validation
on:
  push:
    branches: [fix/safari-native-check-20260927]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare native Safari with normal-motion host settings
        run: |
          mkdir -p "$RUNNER_TEMP/native-normal/baseline" "$RUNNER_TEMP/native-normal/candidate"
          defaults write -g reduceMotion -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool false
          killall cfprefsd || true
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/native-normal/driver.log" 2>&1 &
          git worktree add --detach "$RUNNER_TEMP/native-original" bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a
          python3 -m http.server 8922 --bind 127.0.0.1 --directory "$RUNNER_TEMP/native-original" > "$RUNNER_TEMP/native-normal/baseline-server.log" 2>&1 &
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/native-normal/server.log" 2>&1 &
          shasum -a 256 index.html > "$RUNNER_TEMP/native-normal/source-sha256.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-normal/tested-commit.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/safari-native-audit.py')
          text=p.read_text().replace("and 'error' in result:", "and isinstance(result.get('error'),str):")
          text=text.replace("document.getElementById('nextDrop').focus({preventScroll:true})", "document.getElementById('collectionScrollCue').focus({preventScroll:true})")
          text=text.replace("row={'variant':variant,", "row={'reducedMotion':execute(\"return matchMedia('(prefers-reduced-motion: reduce)').matches\"),'variant':variant,")
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('    for variant,css in '):
                  lines[i]="    for variant,css in [('baseline',''),('repeat-2',''),('repeat-3',''),('repeat-4','')]:"
          p.write_text('\n'.join(lines)+'\n')
          PY
          for attempt in $(seq 1 30); do curl --silent http://127.0.0.1:4444/status > /dev/null && break; sleep 1; done
      - name: Four normal-motion baseline Safari journeys
        run: BASE_URL=http://127.0.0.1:8922/ EVIDENCE_DIR="$RUNNER_TEMP/native-normal/baseline" python3 tests/safari-native-audit.py > "$RUNNER_TEMP/native-normal/baseline.log" 2>&1
      - name: Four normal-motion candidate Safari journeys
        run: BASE_URL=http://127.0.0.1:8921/ EVIDENCE_DIR="$RUNNER_TEMP/native-normal/candidate" python3 tests/safari-native-audit.py > "$RUNNER_TEMP/native-normal/candidate.log" 2>&1
      - name: Verify motion mode and natural film completion
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-normal'
          for variant in ['baseline','candidate']:
              rows=json.loads((root/variant/'safari-native.json').read_text());assert len(rows)==4
              for row in rows:
                  assert row['reducedMotion'] is False,row
                  hero=row['hero'];assert hero['ended'] is True and hero['duration']>0 and hero['time']>=hero['duration']-.005 and hero['error'] is None,hero
                  assert row['segments'][1]['target']=='signup',row
                  assert row['segments'][3]['target']=='overview',row
                  assert row['segments'][-1]['phase']=='vault',row
              print(variant,'4 normal-motion native Safari journeys passed after natural hero playback')
          PY
      - name: Upload native Safari evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-safari-normal-motion
          path: ${{ runner.temp }}/native-normal
          retention-days: 7
