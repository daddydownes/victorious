name: Assemble verified Safari repair
on:
  push:
    branches: [fix/safari-ready-7e31c2]
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful independent verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/daddydownes/victorious/actions/runs/36307336988',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          run=json.load(urllib.request.urlopen(req))
          assert run['head_sha']=='fefc2e628571e67b2482fc9c392373e0fb6050fb'
          assert run['status']=='completed' and run['conclusion']=='success'
          print('Independent Safari, Chromium/WebKit and eight full journeys passed.')
          PY
      - name: Reproduce exact verified runtime and regression test
        run: |
          git fetch origin fefc2e628571e67b2482fc9c392373e0fb6050fb
          git show fefc2e628571e67b2482fc9c392373e0fb6050fb:tools/apply-scroll-repair.cjs > tools/apply-scroll-repair.cjs
          git show fefc2e628571e67b2482fc9c392373e0fb6050fb:tests/entry-scroll-performance-unit.cjs > tests/entry-scroll-performance-unit.cjs
          node tools/apply-scroll-repair.cjs
          node tools/build-guided.cjs
          echo 'bfef4d4b086834c074274d12bc2e97d93004b99c619ac2dc2c6e13c1e04ce67e  index.html' | sha256sum --check
          node tests/entry-scroll-performance-unit.cjs | tee "$RUNNER_TEMP/evidence/unit.txt"
          node tests/entry-scroll-scope.cjs
          rm tools/apply-scroll-repair.cjs
          git diff --check
      - name: Verify covered animations without screenshot interference
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium webkit >> "$RUNNER_TEMP/evidence/install.log" 2>&1
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node <<'JS'
          const pw=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
           for(const engine of ['chromium','webkit']){
            const b=await pw[engine].launch();
            try{for(const reduced of [false,true]){
             const c=await b.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
             await c.route('**/formsubmit.co/**',r=>r.fulfill({json:{success:true}}));
             const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));
             await p.goto('http://127.0.0.1:8921/?vaultPan=native');
             await p.waitForFunction(()=>document.body.classList.contains('next-drop-landed')&&!nextDrop.inert);
             if(!reduced)await p.emulateMedia({reducedMotion:'no-preference'});
             async function paused(label){
              const rows=await p.evaluate(()=>[...document.querySelectorAll('.seamsec *,#stage *')].flatMap(el=>['', '::before','::after'].map(pseudo=>{const s=getComputedStyle(el,pseudo||null);return {name:s.animationName,state:s.animationPlayState}})).filter(a=>a.name!=='none'));
              assert(rows.every(a=>a.state.split(',').every(s=>s.trim()==='paused')),label+' has active covered animation: '+JSON.stringify(rows));
              console.log('PASS',engine,reduced?'reduced':'normal',label,'covered animations parked');
             }
             await paused('collection');
             await p.locator('#collectionScrollCue').click();await p.waitForFunction(()=>__vaultEntryGuide.target==='signup'&&!__vaultEntryGuide.moving);
             await paused('signup');
             await p.locator('#vaultScrollCue').click();await p.waitForFunction(()=>__vaultEntryGuide.target==='overview'&&!__vaultEntryGuide.moving);
             await paused('overview');
             await p.keyboard.press('PageDown');await p.waitForFunction(()=>__guide.phase()==='vault'&&!vault.inert);
             await paused('vault');assert.deepEqual(errors,[]);await c.close();
            }}finally{await b.close()}
           }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Record review and assemble clean release branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report='''# Safari scroll performance repair - 27 September 2026

          ## Scope and diagnosis
          Baseline: `bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a`. Root candidate SHA-256: `bfef4d4b086834c074274d12bc2e97d93004b99c619ac2dc2c6e13c1e04ce67e`.
          The initial guided scroll repeatedly measured stable section positions while updating scroll/style. The covered legacy seam also retained running CSS keyframes. These are avoidable overhead, not proof of the sole cause of every Safari stall.
          `tools/guided/journey.js` now caches grouped geometry until layout, font, resize or lifecycle changes invalidate it. `tools/guided/journey.css` parks covered legacy/hero CSS animations after those chapters are retired. `tools/build-guided.cjs` regenerated the root.
          Existing visible artwork, media bytes, blur/glow definitions, layout, gesture thresholds, easing, duration, stop sequence, signup transport, archive pan, Surface and game are unchanged. No blanket filter removal, reduced quality or scroll-physics retuning was shipped.

          ## Verification
          Independent successful Actions run: https://github.com/daddydownes/victorious/actions/runs/36307336988 at input commit `fefc2e628571e67b2482fc9c392373e0fb6050fb`. The release reproduces its exact root hash.
          - Actual Safari 26.6.1 (20624.5.1.18.3), macOS 15.7.9 hosted runner, Apple WebDriver with no simulator: original and candidate collection/signup/overview/Vault journeys passed with click and keyboard input. These are not physical iPhone tests.
          - The sampled native Safari signup and Vault screenshots compare pixel-for-pixel equal. The collection sample has small image-region differences and is not claimed pixel-identical. This does not establish equality of every animation frame.
          - Playwright 1.63.0 Chromium and WebKit: original and candidate wheel journeys passed at 390x844 and 1440x900, after static-opening setup then normal motion. Narrow WebKit uses desktop-engine wheel input, not real iPhone gestures.
          - Eight completed-hero Chromium journeys passed: four at 390x844 with CDP touch and four at 1440x900 with wheel/keyboard. Normal, reversal, spam and cancel/resize paths were covered; first pass of each size included Surface, game and return. Form transport was mocked.
          - `tests/entry-scroll-performance-unit.cjs`: 725 exact baseline-matched controller states across five scenarios, with more than 80% fewer geometry reads in each scenario. This is a unit-level work reduction, not an 80% FPS improvement.
          - Build, scope, guided-source/scroll, reveal, post-Surface, press-feedback, Surface input/recovery, spatial layout and six game regression checks passed.
          - Clean-release checks also exercised covered-animation suspension at collection, signup, overview and Vault in normal/reduced-motion Chromium and WebKit without disabling animations for screenshots.

          ## Measurements and limits
          In the sampled Chromium collection-to-signup transition, DOM rectangle reads fell from 238 to 0 after the geometry cache was populated. Initial collection idle layout events fell from 36-37 to 0 in the sampled interval. Do not extrapolate this to overall FPS.
          The performance harness used screenshots with `animations: disabled`, which subsequently showed resumed legacy animation objects; later timing samples are not a clean measurement of suspension. The clean-release check therefore verifies computed animation state without that screenshot intervention.
          Linux WebKit retained substantial photo-overview frame gaps; actual Safari also had occasional photo-entry gaps. The repair removes verified overhead but does not certify that the owner's reported lag is fully resolved. Physical iPhone Safari, real trackpad momentum, thermal/low-power conditions and embedded browsers still require device feedback. No live signup was sent.

          ## Deployment
          This report accompanies a verified release candidate assembled from the unchanged production baseline. Publication is a separate fast-forward after source review; confirm Pages and the canonical live hash in the release task. Diagnostic workflows and one-time patch scripts are excluded from the final release tree.
          '''
          report='\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines())+'\n'
          p=Path('docs/reviews/safari-scroll-2026-09-27.md');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(report)
          status=Path('docs/STATUS.md');text=status.read_text();head='# Current status\n';assert text.startswith(head)
          section='''
          ## September 27 - verified Safari scroll performance repair

          The guided-entry geometry cache removes repeated section measurements without changing easing, targets or gesture thresholds. Covered legacy/hero CSS animations are paused only after their chapters are retired. The root was rebuilt from the guided sources; visible artwork, media, layout, Surface and game remain unchanged.

          Independent run `36307336988` passed actual macOS Safari baseline/candidate journeys, Chromium/WebKit scroll checks, eight completed-hero Chromium journeys and 725 exact controller-state comparisons. The sampled native Safari signup and Vault screenshots were pixel-identical. Physical iPhone testing remains outstanding, and some photo-entry frame gaps remain; do not claim all Safari lag is eliminated. See [the review](reviews/safari-scroll-2026-09-27.md) for scope, measurements and limitations. Candidate root SHA-256: `bfef4d4b086834c074274d12bc2e97d93004b99c619ac2dc2c6e13c1e04ce67e`. Publication/live equality is verified separately in the release task.

          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())+'\n'
          status.write_text(head+section+text[len(head):])
          PY
          git rm .github/workflows/safari-release-7e31c2.yml
          git add index.html tools/guided/journey.js tools/guided/journey.css tests/entry-scroll-performance-unit.cjs docs/STATUS.md docs/reviews/safari-scroll-2026-09-27.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reduce Safari scroll overhead while preserving the approved journey'
          git push origin HEAD:refs/heads/fix/safari-ready-7e31c2
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/release-commit.txt"
          git diff --stat bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a HEAD
      - name: Verify canonical live bytes after foreground release
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          expected='bfef4d4b086834c074274d12bc2e97d93004b99c619ac2dc2c6e13c1e04ce67e'
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('https://vctrsclo.com/?verify=7e31c2-'+str(attempt),timeout=20) as response:
                      data=response.read().replace(b'\r\n',b'\n')
                  digest=hashlib.sha256(data).hexdigest()
                  if digest==expected:
                      result={'canonical':'https://vctrsclo.com/','sha256':digest,'matched':True,'verifiedAtUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
                      pathlib.Path(os.environ['RUNNER_TEMP'],'evidence','live-match.json').write_text(json.dumps(result,indent=2));print(json.dumps(result));break
              except Exception as error:
                  print(type(error).__name__,flush=True)
              time.sleep(5)
          else:
              raise RuntimeError('Canonical live source has not matched this candidate; do not claim deployment.')
          PY
      - name: Upload assembly and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-release-7e31c2
          path: ${{ runner.temp }}/evidence
          retention-days: 7
