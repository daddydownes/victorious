name: Safari regression isolation
on:
  push:
    branches: [qa/safari-isolation-20260927]
permissions:
  contents: read
jobs:
  edge-cases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            case: webkit-390-844
            pattern: reverse-jitter
          - os: macos-latest
            case: webkit-844-390
            pattern: normal
          - os: ubuntu-22.04
            case: chromium-320-568
            pattern: spam
          - os: ubuntu-22.04
            case: chromium-844-390
            pattern: normal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned engines
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8921/" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium webkit >> "$RUNNER_TEMP/evidence/install.log" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/entry-scroll-browser.cjs')
          p.write_text(p.read_text().replace('isMobile:mobile','isMobile:engine===\'chromium\'&&mobile'))
          PY
      - name: Compare identical input against both source versions
        env:
          QA_CASE: ${{ matrix.case }}
          QA_PATTERN: ${{ matrix.pattern }}
          QA_PASSES: '2'
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          cp index.html "$RUNNER_TEMP/candidate.html"
          git show bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a:index.html > index.html
          EVIDENCE_DIR="$RUNNER_TEMP/evidence/baseline" node tests/entry-scroll-browser.cjs > "$RUNNER_TEMP/evidence/baseline.log" 2>&1 && echo baseline-pass || echo baseline-fail
          cp "$RUNNER_TEMP/candidate.html" index.html
          EVIDENCE_DIR="$RUNNER_TEMP/evidence/candidate" node tests/entry-scroll-browser.cjs > "$RUNNER_TEMP/evidence/candidate.log" 2>&1 && echo candidate-pass || echo candidate-fail
          cat "$RUNNER_TEMP/evidence/baseline.log" "$RUNNER_TEMP/evidence/candidate.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-edge-${{ matrix.case }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
  photo-arrival:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose first photo frame
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/evidence/install.log" 2>&1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps webkit >> "$RUNNER_TEMP/evidence/install.log" 2>&1
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/evidence/server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/qa/node_modules" BASE_URL=http://127.0.0.1:8921/ EVIDENCE_DIR="$RUNNER_TEMP/evidence" node tests/photo-arrival-profile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-photo-arrival
          path: ${{ runner.temp }}/evidence
          retention-days: 7
