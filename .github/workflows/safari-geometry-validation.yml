name: Safari geometry validation
on:
  push:
    branches: [fix/safari-geometry-verified-20260927]
permissions:
  contents: read
concurrency:
  group: safari-geometry-validation
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated tools and evidence
        run: |
          mkdir -p "$RUNNER_TEMP/geometry-evidence/baseline" "$RUNNER_TEMP/geometry-evidence/candidate"
          echo "NODE_PATH=$RUNNER_TEMP/geometry-qa/node_modules" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8921/" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/geometry-qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/geometry-evidence/install.log" 2>&1
          "$RUNNER_TEMP/geometry-qa/node_modules/.bin/playwright" install --with-deps chromium webkit >> "$RUNNER_TEMP/geometry-evidence/install.log" 2>&1
      - name: Baseline measurements
        run: |
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/geometry-evidence/server.log" 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8921/ > /dev/null && break; sleep 1; done
          EVIDENCE_DIR="$RUNNER_TEMP/geometry-evidence/baseline" QA_PASSES=2 node tests/safari-scroll-performance.cjs > "$RUNNER_TEMP/geometry-evidence/baseline.log" 2>&1
      - name: Build minimal repair and check preserved scope
        run: |
          node tools/apply-safari-scroll-fix.cjs
          node tools/build-guided.cjs
          git diff --check
          git diff --stat
          git diff > "$RUNNER_TEMP/geometry-evidence/repair.patch"
          for test in guided-source entry-scroll-scope guided-scroll reveal post-surface-scroll press-feedback surface-input surface-recovery vault-spatial-layout flappy-difficulty flappy-collision flappy-material flappy-lifecycle flappy-death flappy-reachability; do
            node "tests/$test.cjs" | tee -a "$RUNNER_TEMP/geometry-evidence/static.log"
          done
          tar -czf "$RUNNER_TEMP/geometry-evidence/candidate-source.tgz" index.html tools/guided/journey.js tools/guided/journey.css
          sha256sum index.html > "$RUNNER_TEMP/geometry-evidence/source-sha256.txt"
      - name: Candidate measurements
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/geometry-evidence/candidate" QA_PASSES=2 node tests/safari-scroll-performance.cjs > "$RUNNER_TEMP/geometry-evidence/candidate.log" 2>&1
      - name: Repeated completed-hero touch journeys
        run: |
          for view in chromium-390-844 chromium-844-390 chromium-1440-900; do
            EVIDENCE_DIR="$RUNNER_TEMP/geometry-evidence/journeys-$view" QA_CASE="$view" QA_PASSES=4 node tests/entry-scroll-browser.cjs | tee "$RUNNER_TEMP/geometry-evidence/journeys-$view.log"
          done
      - name: Keyboard geometry and pointer recovery
        run: |
          for engine in chromium webkit; do
            EVIDENCE_DIR="$RUNNER_TEMP/geometry-evidence/signup-$engine" TEST_ENGINE="$engine" node tests/signup-viewport-browser.cjs | tee "$RUNNER_TEMP/geometry-evidence/signup-$engine.log"
          done
      - name: Save validated source only to task branch
        run: |
          test "$(git branch --show-current)" = fix/safari-geometry-verified-20260927
          git config user.name "VCTRS performance validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/guided/journey.js tools/guided/journey.css
          git commit -m "Cache entry geometry and suspend covered legacy animations without retiming [skip ci]"
          git push origin HEAD:fix/safari-geometry-verified-20260927
          git rev-parse HEAD > "$RUNNER_TEMP/geometry-evidence/validated-commit.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-geometry-validation
          path: ${{ runner.temp }}/geometry-evidence
          retention-days: 7
  native-safari:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native Safari
        run: |
          mkdir -p "$RUNNER_TEMP/native-geometry/baseline" "$RUNNER_TEMP/native-geometry/candidate"
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/native-geometry/driver.log" 2>&1 &
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/native-geometry/server.log" 2>&1 &
          echo "BASE_URL=http://127.0.0.1:8921/" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do curl --silent http://127.0.0.1:4444/status > /dev/null && break; sleep 1; done
      - name: Measure baseline Safari
        run: EVIDENCE_DIR="$RUNNER_TEMP/native-geometry/baseline" python3 tests/safari-native-audit.py > "$RUNNER_TEMP/native-geometry/baseline.log" 2>&1
      - name: Build unchanged-look candidate
        run: |
          node tools/apply-safari-scroll-fix.cjs
          node tools/build-guided.cjs
          shasum -a 256 index.html > "$RUNNER_TEMP/native-geometry/source-sha256.txt"
      - name: Measure candidate Safari
        run: EVIDENCE_DIR="$RUNNER_TEMP/native-geometry/candidate" python3 tests/safari-native-audit.py > "$RUNNER_TEMP/native-geometry/candidate.log" 2>&1
      - name: Upload native Safari evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-geometry-native
          path: ${{ runner.temp }}/native-geometry
          retention-days: 7
