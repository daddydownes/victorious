name: Final scroll regression validation
on:
  push:
    branches: [fix/safari-geometry-verified-20260927]
permissions:
  contents: read
concurrency:
  group: safari-geometry-validation
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare final source and independent baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/final-evidence"
          echo "NODE_PATH=$RUNNER_TEMP/final-qa/node_modules" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:8921/" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/final-qa" --no-audit --no-fund playwright@1.63.0 > "$RUNNER_TEMP/final-evidence/install.log" 2>&1
          "$RUNNER_TEMP/final-qa/node_modules/.bin/playwright" install --with-deps chromium webkit >> "$RUNNER_TEMP/final-evidence/install.log" 2>&1
          git worktree add --detach "$RUNNER_TEMP/original-site" bac0b908e9814487c4c7fa8d7f8f05c43cfaba1a
          python3 -m http.server 8922 --bind 127.0.0.1 --directory "$RUNNER_TEMP/original-site" > "$RUNNER_TEMP/final-evidence/baseline-server.log" 2>&1 &
          python3 -m http.server 8921 --bind 127.0.0.1 > "$RUNNER_TEMP/final-evidence/server.log" 2>&1 &
          gh api repos/daddydownes/victorious/git/blobs/2c743003f5f871ec0095c21ddb2849a5c4679930 --jq .content | base64 --decode > tests/entry-geometry-equivalence.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/guided/journey.js');s=p.read_text();assert s.count('if(entryGeometry)return entryGeometry;')==1
          p.write_text(s.replace('if(entryGeometry)return entryGeometry;','if(entryGeometry&&window.ResizeObserver)return entryGeometry;'))
          PY
          node tools/build-guided.cjs
          node tests/entry-geometry-equivalence.cjs | tee "$RUNNER_TEMP/final-evidence/equivalence.json"
          node tests/entry-scroll-scope.cjs
          node tests/guided-source.cjs
          git diff --check
          sha256sum index.html > "$RUNNER_TEMP/final-evidence/source-sha256.txt"
      - name: Establish whether the old landscape probe also fails on baseline
        run: |
          set +e
          BASE_URL=http://127.0.0.1:8922/ EVIDENCE_DIR="$RUNNER_TEMP/final-evidence/baseline-original-probe" QA_CASE=chromium-844-390 QA_PASSES=1 node tests/entry-scroll-browser.cjs > "$RUNNER_TEMP/final-evidence/baseline-original-probe.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/final-evidence/baseline-original-probe.exit"
      - name: Correct navigation probes without altering website gestures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/entry-scroll-browser.cjs');s=p.read_text();old='const x=view.width*.5,start=view.height'
          assert s.count(old)==1
          p.write_text(s.replace(old,'const x=view.width*.04,start=view.height'))
          p=Path('tests/signup-viewport-browser.cjs');s=p.read_text();old='const p=await c.newPage();p.setDefaultTimeout(30000);p.on'
          assert s.count(old)==1
          new="""const p=await c.newPage();p.setDefaultTimeout(30000);
          // Linux WebKit has no usable hero codec here. Exercise signup with a
          // static opening, then restore the requested motion mode before QA.
          // This is not a completed-hero WebKit or physical-keyboard certificate.
          if(engine==='webkit'){
            const wrap=navigate=>async(...args)=>{await p.emulateMedia({reducedMotion:'reduce'});const response=await navigate(...args);await p.waitForFunction(()=>!nextDrop.inert);await p.emulateMedia({reducedMotion:motion});return response};
            p.goto=wrap(p.goto.bind(p));p.reload=wrap(p.reload.bind(p));
          }
          p.on"""
          p.write_text(s.replace(old,new))
          PY
      - name: Validate corrected landscape input on unchanged production source
        run: |
          BASE_URL=http://127.0.0.1:8922/ EVIDENCE_DIR="$RUNNER_TEMP/final-evidence/baseline-landscape" QA_CASE=chromium-844-390 QA_PASSES=1 node tests/entry-scroll-browser.cjs | tee "$RUNNER_TEMP/final-evidence/baseline-landscape.log"
      - name: Four final landscape journeys
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/final-evidence/candidate-landscape" QA_CASE=chromium-844-390 QA_PASSES=4 QA_SOURCE_SHA256="$(cut -d' ' -f1 "$RUNNER_TEMP/final-evidence/source-sha256.txt")" node tests/entry-scroll-browser.cjs | tee "$RUNNER_TEMP/final-evidence/candidate-landscape.log"
      - name: WebKit signup geometry with declared static-opening setup
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/final-evidence/signup-webkit" TEST_ENGINE=webkit node tests/signup-viewport-browser.cjs | tee "$RUNNER_TEMP/final-evidence/signup-webkit.log"
      - name: Record portable handoff and save validated branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/STATUS.md');s=p.read_text();heading='# Current status\n'
          assert s.startswith(heading)
          note='\n## September 27 — Safari scroll performance repair\n\nThe repair preserves the approved look, chapter stops, gesture thresholds, easing and duration. Pre-Vault geometry is cached only while ResizeObserver can invalidate it; resize, focus, fonts, content geometry and lifecycle changes refresh it. Older engines retain live measurements. Covered legacy seam decorations are paused during the current journey; visible lighting, photographs, hero, Surface and game remain unchanged. See `docs/reviews/safari-scroll-2026-09-27.md` for test evidence, limitations and deployment state. No production permission is inferred from an Actions step summary; per-test JSON outcomes are checked.\n'
          p.write_text(heading+note+s[len(heading):])
          p=Path('docs/DECISIONS.md');s=p.read_text();heading=s.splitlines()[0]+'\n'
          note='\n## September 27 — remove redundant work, not the visual experience\n\nThe owner authorized Safari scrolling repairs while preserving the look and feel. Keep the existing scripted landing sequence and its timing; optimize geometry reads and decorations only when completely covered. Do not remove visible glow, lower image quality, retime the entrance, or replace guided gestures with a different journey. Distinguish native Safari, Linux WebKit, synthetic viewport signals and physical-device evidence.\n'
          p.write_text(heading+note+s[len(heading):])
          PY
          test "$(git branch --show-current)" = fix/safari-geometry-verified-20260927
          git config user.name "VCTRS performance validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/guided/journey.js tools/guided/journey.css tests/entry-geometry-equivalence.cjs tests/entry-scroll-browser.cjs tests/signup-viewport-browser.cjs docs/STATUS.md docs/DECISIONS.md
          git commit -m "Verify final scroll repair, no-observer fallback and safe navigation probes [skip ci]"
          git push origin HEAD:fix/safari-geometry-verified-20260927
          git rev-parse HEAD > "$RUNNER_TEMP/final-evidence/validated-commit.txt"
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-scroll-regressions
          path: ${{ runner.temp }}/final-evidence
          retention-days: 7
