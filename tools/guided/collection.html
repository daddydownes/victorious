<section class="next-drop" id="nextDrop" aria-label="Victorious clothing and signup" aria-hidden="true" inert>

      <figure class="collection-piece"><button type="button" class="collection-open" data-view-product="spray-tee" aria-label="View spray T-shirt photo in detail"><img data-product="spray-tee" width="1080" height="1432" decoding="async" alt="White T-shirt laid flat on dark pavement, with the VCTRS spray-can graphic."></button></figure>

        <div class="next-drop-email-row"><input id="nextDropEmailInput" type="email" autocomplete="email" placeholder="Your email address" aria-describedby="nextDropResult" required><button type="submit">JOIN</button></div>
        <div class="next-drop-result" id="nextDropResult" aria-live="polite"></div>

          <span class="popup-name">Pass the Mic Canberra <span aria-hidden="true">↗</span></span>

        <p class="vault-descent-instruction" aria-hidden="true">KEEP SCROLLING TO ENTER <span>↓</span></p>
        <button type="button" id="nextVaultHold" class="vhold next-vault-hold" aria-label="Enter the vault"><span class="vh-base">ENTER THE VAULT</span></button>
      </div>
    </section>

  <dialog id="productViewer" class="product-viewer" aria-label="Previous drop photo">
