<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Flappy V automatic preview</title>
<style>  /* ---- FLAPPY-V: the last beat of BEYOND — fly the V through the seam ----
     The panel is a teaser; the game itself runs in a fullscreen overlay that
     locks scroll and input until ▕ EXIT or Escape. */
  .flap{margin:clamp(56px,9vw,110px) auto 0; max-width:820px; text-align:center}
  .flap-label{letter-spacing:.3em; text-transform:uppercase; font-size:11px; color:var(--gold);
    margin-bottom:14px}
  .flap-teaser{border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:clamp(36px,6vw,64px) 20px; background:#000}
  .flap-sub{letter-spacing:.18em; font-size:10px; color:var(--bone-dim); text-transform:uppercase;
    margin:14px 0 26px; line-height:1.8}
  .flap-play{background:var(--gold); color:var(--ink); border:0; cursor:pointer; border-radius:0;
    font-family:'Cascadia Mono',Consolas,monospace; font-size:12px; letter-spacing:.28em;
    text-transform:uppercase; padding:15px 34px; transition:background .25s ease, transform .12s ease}
  .flap-play:hover{background:var(--gold-hot)}
  .flap-play:focus-visible{outline:1px solid var(--gold-hot); outline-offset:3px}
  .flap-best{margin-top:18px; letter-spacing:.24em; font-size:10px; color:var(--gold);
    text-transform:uppercase; opacity:.85; min-height:1em}
  /* Flappy V — the original immersive full-screen vault, with floating HUD. */
  .flap-overlay{position:fixed;inset:0;z-index:400;background:#060605;display:none;
    overscroll-behavior:contain;touch-action:none;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:var(--bone);
    background-image:radial-gradient(ellipse at 50% 48%,#17150e 0,transparent 65%)}
  .flap-overlay.on{display:block}
  .flap-flight-space{position:absolute;inset:0}
  .flap-arena{position:absolute;inset:0;width:100%;height:100%;background:#000;overflow:hidden}
  #flap{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
  .flap-top{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));
    right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:16px;pointer-events:none;text-shadow:0 2px 12px #000}
  .flap-name{font:600 12px Consolas,monospace;letter-spacing:.19em;color:var(--gold);margin-right:auto}
  .flap-name small{display:block;font:9px Consolas,monospace;letter-spacing:.12em;color:#8c8779;margin-top:5px}
  .flap-hud{display:flex;align-items:baseline;gap:6px;font:10px Consolas,monospace;color:var(--gold)}
  .flap-hud strong{font:500 30px/1 Consolas,monospace;letter-spacing:-.05em;color:var(--bone)}
  .flap-hud small{font:10px Consolas,monospace;color:#a39a84;letter-spacing:0}
  .flap-exit{min-height:44px;min-width:44px;pointer-events:auto;padding:10px 13px;
    color:var(--bone);background:#ffffff05;border:1px solid #ffffff1c;border-radius:4px;
    font:10px Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .flap-exit:hover{background:#d4af5f16;border-color:#d4af5f70}
  .flap-exit:active{background:#d4af5f28}
  .flap-pause[hidden]{display:none}
  .flap-bottom{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(390px,calc(100% - 32px));pointer-events:none}
  .flap-tier{text-align:center;color:var(--gold);font:10px/1.5 Consolas,monospace;letter-spacing:.16em;margin-bottom:8px;min-height:15px}
  .flap-progress{display:flex;gap:5px;height:3px}
  .flap-progress i{display:block;flex:1;position:relative;background:#ffffff17;overflow:hidden}
  .flap-progress i::after{content:'';display:block;height:100%;background:var(--gold);transform:scaleX(var(--fill,0));transform-origin:left}
  .flap-milestones{display:flex;justify-content:space-between;font:8px Consolas,monospace;color:#817a69;margin-top:5px}
  .flap-panel{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(360px,calc(100% - 40px));padding:32px 24px;text-align:center;box-sizing:border-box;
    background:linear-gradient(155deg,#18160ff5,#080807fa);border:1px solid #d4af5f38;
    border-radius:8px;box-shadow:0 22px 70px #0009}
  .flap-panel[hidden]{display:none}
  @media(prefers-reduced-motion:no-preference){
    .flap-panel:not([hidden]){animation:flapPanelIn 180ms ease-out both}
  }
  @keyframes flapPanelIn{from{opacity:0;transform:translate(-50%,calc(-50% + 6px))}to{opacity:1;transform:translate(-50%,-50%)}}
  .flap-panel .eyebrow{color:#b6a680;font:9px Consolas,monospace;letter-spacing:.23em}
  .flap-panel h2{font:500 clamp(26px,5vw,38px)/1.06 Consolas,monospace;letter-spacing:-.05em;color:var(--bone);margin:20px 0 14px}
  .flap-panel p{color:#b9b3a5;font:12px/1.8 Consolas,monospace;margin:0 0 24px}
  .flap-panel button{min-height:48px;width:100%;border-radius:3px;letter-spacing:.16em}
  .flap-overlay button:focus-visible{outline:2px solid var(--gold-hot);outline-offset:3px}
  .flap-orientation{display:none}
  @media(max-width:400px){.flap-top{gap:8px}.flap-name{font-size:10px}.flap-name small{font-size:8px}.flap-exit{padding:10px}.flap-hud strong{font-size:26px}}
  @media(max-height:480px){
    .flap-top{top:6px}.flap-bottom{bottom:6px}.flap-panel{padding:18px 22px;width:min(360px,calc(100% - 40px))}
    .flap-panel h2{font-size:25px;margin:12px 0}.flap-panel p{margin-bottom:12px;font-size:11px;line-height:1.5}
    .flap-panel .eyebrow{font-size:8px}.flap-orientation{display:block;margin-top:8px;font-size:9px;color:#8c8779}}

.flap-overlay{--ink:#0b0a08;--bone:#efe9dc;--bone-dim:#b9b0a0;--gold:#d4af5f;--gold-hot:#f0d492;--line:rgba(212,175,95,.25);z-index:10000}
body.flap-game-locked{overflow:hidden!important}
.flap-overlay,.flap-overlay *{box-sizing:border-box}
.flap-overlay button{touch-action:manipulation}
.flap-source-mark{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#flapPlay,.flap-top,.flap-bottom,.flap-panel{display:none!important}
.flap-overlay{display:block!important;position:absolute;pointer-events:none}

          var nb=bg.near[j], ns=64*nb.sc;
          fctx.globalAlpha=nb.a;
          fctx.drawImage(spr.bokeh,nb.x-ns/2,nb.y-ns/2,ns,ns);
        }
        for(j=0;j<bg.streaks.length;j++){
          var sk=bg.streaks[j];
          fctx.globalAlpha=sk.a||0;
          fctx.drawImage(spr.streak,sk.x,sk.y,sk.len,2);
        }
        fctx.globalAlpha=1; fctx.globalCompositeOperation='source-over';
      }
      // gates: monolith slabs from pre-baked sprites — 3 blits per slab, no
      // per-frame gradients, text, or shadowBlur
      for(var i=0;i<FG.gates.length;i++){
        var g=FG.gates[i], ga=null,gbPose=null;
        if(frame.a) for(var ri=0;ri<frame.a.gates.length;ri++)if(frame.a.gates[ri].serial===g.serial){ga=frame.a.gates[ri];break;}
        if(frame.b) for(var rj=0;rj<frame.b.gates.length;rj++)if(frame.b.gates[rj].serial===g.serial){gbPose=frame.b.gates[rj];break;}
        ga=ga||g;gbPose=gbPose||g;
        var x=flapMix(ga.x,gbPose.x,frame.blend), gw=flapGateWidth(g,s);
        if(x>s.w || x+gw<0) continue;
        var gy=flapMix(ga.y,gbPose.y,frame.blend), opening=flapMix(ga.opening,gbPose.opening,frame.blend);
        var gt=Math.max(0,flapMix(ga.top,gbPose.top||0,frame.blend)), gb=flapMix(ga.bottom,gbPose.bottom===undefined?s.h:gbPose.bottom,frame.blend);
        if(g.level && !g.locked){
          var preview=flapHazardPolygons(g,s,{x:x,y:g.target,opening:g.finalOpening,top:g.target-g.finalOpening/2,bottom:g.target+g.finalOpening/2});
          fctx.strokeStyle='rgba(240,212,146,.26)';fctx.lineWidth=1;fctx.setLineDash([4,5]);
          for(var pi=0;pi<preview.length;pi++){
            var outline=preview[pi];fctx.beginPath();fctx.moveTo(outline[0][0],outline[0][1]);
            for(var pj=1;pj<outline.length;pj++)fctx.lineTo(outline[pj][0],outline[pj][1]);
            fctx.closePath();fctx.stroke();
          }
          fctx.setLineDash([]);
        }
        var shapes=flapHazardPolygons(g,s,{x:x,y:gy,opening:opening,top:gt,bottom:gb});
        for(var side=0;side<shapes.length;side++){
          window.flapDrawMetal(fctx,shapes[side],s,(g.kind||'PILLAR').toLowerCase(),side,(FG.bgT||0)*.08+g.serial*.13);
        }
      }
      flapDrawV(s.w*0.24,flapMix(frame.a?frame.a.y:FG.y,frame.b?frame.b.y:FG.y,frame.blend)*s.h,flapMix(frame.a?frame.a.rot:FG.rot,frame.b?frame.b.rot:FG.rot,frame.blend),FG.state==='dead'?0:FG.state==='dying'?1-flapSmooth((FG.deadT-.24)/.5):1,s);
      // particles — additive gold glow on black
      fctx.globalCompositeOperation='lighter';
      for(var pi=0;pi<FG.parts.length;pi++){
        var pt=FG.parts[pi], a=Math.max(0,1-pt.t/pt.life);
        fctx.globalAlpha=a; fctx.fillStyle=pt.c;
        fctx.fillRect(pt.x,pt.y,pt.sz,pt.sz);
      }
      fctx.globalAlpha=1; fctx.globalCompositeOperation='source-over';
      fctx.globalAlpha=1;
      fctx.restore();
      // HUD — unshaken so the shake reads
      flapPanels();

    }

// PRODUCTION_GAMEPLAY_END
    var requested=false,previewFrames=0,previewFrame=0,previewLast=0,previewAccumulator=0;
    var previewHops=0;
    function previewSpawn(s){
      flapSpawn(s);
      var gate=FG.gates[FG.gates.length-1],route=[.48,.47,.48,.50,.49,.47,.48,.51,.50,.48];
      gate.target=gate.baseY=gate.y=s.h*route[gate.serial%route.length];
      gate.anchor=s.h*route[Math.max(0,gate.serial-1)%route.length];
      // Present the complete shape in the card. The real game's warning/entry
      // motion starts outside the screen and can crop finite jaws in a teaser.
      gate.finalOpening=Math.max(148,gate.finalOpening);
      gate.opening=gate.finalOpening;gate.reveal=1;gate.locked=true;
      flapGateUpdate(gate,s,0);
    }
    function previewReset(){
      FG=flapNewState();FG.state='play';FG.score=0;fWon=true;
      var s=flapSize();previewSpawn(s);previewSpawn(s);
      FG.gates[0].x=s.w*.57;FG.gates[1].x=s.w*.98;
      FG.gates.forEach(function(g){flapGateUpdate(g,s,0)});
      FG.y=FG.gates[0].y/s.h+.035;FG.vy=-.62;
      flapResetFrames();flapDraw(s);
    }
    function previewStep(dt,s){
      FG.speed+=(flapPace(FG.score)-FG.speed)*(1-Math.exp(-dt/.65));
      var dx=FG.speed*s.w*dt;
      FG.gates.forEach(function(g){g.x-=dx;flapGateUpdate(g,s,dt);if(!g.counted&&g.x+flapGateWidth(g,s)<s.w*.24){g.counted=true;FG.score++;}});
      FG.gates=FG.gates.filter(function(g){return g.x+flapGateWidth(g,s)>-10});
      if(!FG.gates.length||FG.gates[FG.gates.length-1].x<s.w*.6)previewSpawn(s);
      var next=FG.gates.find(function(g){return g.x+flapGateWidth(g,s)>s.w*.24-FLAP_LOGO_RADIUS;});
      var target=next?next.y/s.h:.48;
      // Steer only by choosing when to tap. Position is never pulled toward a
      // gate or reset at the bottom of an arc: every hop uses game physics.
      if(FG.vy>=0&&FG.y>target+.035){FG.vy=-.62;previewHops++;}
      FG.vy=Math.min(.70,FG.vy+2.60*dt);FG.y+=FG.vy*dt;
      var rotation=-.35+(FG.vy+.62)/1.32*1.31;
      FG.rot+=Math.max(-.35,Math.min(.35,(rotation-FG.rot)*Math.min(1,10*dt)));
      fSimTime+=dt;flapSaveFrame();
    }
    function previewDraw(now){
      previewFrame=0;if(!requested||document.hidden||reduced)return;
      var dt=previewLast?Math.min(.04,(now-previewLast)/1000):0;previewLast=now;
      var s=flapSize();previewAccumulator+=dt;
      while(previewAccumulator+1e-10>=1/120){previewStep(1/120,s);previewAccumulator=Math.max(0,previewAccumulator-1/120);}
      flapEffects(dt,s);flapDraw(s,previewAccumulator*120);previewFrames++;
      previewFrame=requestAnimationFrame(previewDraw);
    }
    function previewSync(){
      var run=requested&&!document.hidden&&!reduced;
      if(!run){if(previewFrame)cancelAnimationFrame(previewFrame);previewFrame=0;previewLast=0;previewAccumulator=0;return;}
      if(!previewFrame)previewFrame=requestAnimationFrame(previewDraw);
    }
    addEventListener('message',function(e){if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.type==='vctrs-preview'){requested=e.data.active===true;previewSync()}});
    document.addEventListener('visibilitychange',previewSync);
    refreshGameMotion=previewSync;
    addEventListener('resize',function(){if(FG)flapDraw(flapSize())});
    window.__flap={state:function(){return FG&&FG.state},score:function(){return FG&&FG.score},dbg:function(){return FG}};
    window.__preview={active:function(){return !!previewFrame},frames:function(){return previewFrames},hops:function(){return previewHops}};
    previewReset();parent.postMessage({type:'vctrs-preview-ready'},location.origin);
  }
})();</script></body></html>
